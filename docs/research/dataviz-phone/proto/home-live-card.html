<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home live card</title>
<link rel="stylesheet" href="common.css">
<style>
  .pulse { display: flex; align-items: flex-end; gap: 2px; height: 56px; border-bottom: 2.5px solid var(--ink); }
  .pulse i { flex: 1; min-width: 2px; background: var(--ink); border-radius: 2px 2px 0 0; min-height: 0; }
  .pulse i.future { background: transparent; border-top: 2px dotted rgba(30,27,46,.25); height: 0; }
  .pulse i.now { background: var(--coral); }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 6px; text-align: center; min-width: 0; }
  .stat .num { font-size: 24px; display: block; } .stat .caps { font-size: 10px; letter-spacing: 1px; }
  .pair { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 0; }
  .pair + .pair { border-top: 1.5px dashed rgba(30,27,46,.2); }
  .pair .names { font-size: 14px; }
  .big { font-size: 44px; }
  .delta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="dock" aria-label="Dock"><span class="on">Inicio</span><span>Conectar</span><span>Conexiones</span><span>Ranking</span></nav>
<script src="engine.js"></script>
<script>
const { run, avatar, label, first, esc, fmt, clock, ago, tr } = COMPA;
const BUCKET = 300, LAST_CALL = 1800;

// Connections per 5 min over the WHOLE night; future buckets stay empty so the axis does not jump.
function pulse(st) {
  const { s, t } = st;
  const n = Math.max(1, Math.ceil((s.eventEndsAtSec - s.eventStartsAtSec) / BUCKET));
  const nowI = Math.min(n - 1, Math.max(0, Math.floor((t - s.eventStartsAtSec) / BUCKET)));
  const vals = new Array(n).fill(0);
  for (const c of st.connections) { const i = Math.floor((c.t - s.eventStartsAtSec) / BUCKET); if (i >= 0 && i < n) vals[i]++; }
  const max = Math.max(1, ...vals);
  const bars = vals.map((v, i) => {
    if (st.phase !== "ended" && i > nowI) return `<i class="future"></i>`;
    return `<i class="${st.phase === "running" && i === nowI ? "now" : ""}" style="height:${v ? Math.max(6, Math.round((v / max) * 100)) : 0}%"></i>`;
  }).join("");
  const peak = vals.indexOf(max);
  return { html: `<div class="pulse" role="img" aria-label="${tr("Conexiones cada 5 minutos", "Connections every 5 minutes")}">${bars}</div>
    <div class="axis"><span>${clock(st, s.eventStartsAtSec)}</span>${max > 1 || vals[peak] ? `<span>${tr("pico", "peak")} ${fmt(max)}/5 min</span>` : ""}<span>${clock(st, s.eventEndsAtSec)}</span></div>`, max: vals[peak], total: vals.reduce((a, b) => a + b, 0) };
}

function countdown(st) {
  const sec = Math.max(0, st.s.eventStartsAtSec - st.t), m = Math.ceil(sec / 60);
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
}

function header(st) {
  const left = st.s.eventEndsAtSec - st.t;
  if (st.phase === "ended") return [`<span class="pill ink">${tr("Final", "Final")}</span>`, "tone-sun-soft"];
  if (st.phase === "upcoming") return [`<span class="pill sun">${tr("Puertas abren pronto", "Doors open soon")}</span>`, "tone-sky-soft"];
  if (left <= LAST_CALL) return [`<span class="pill coral"><span class="live-dot"></span>${tr("Última llamada", "Last call")}</span>`, "tone-coral-soft"];
  return [`<span class="pill coral"><span class="live-dot"></span>${tr("En vivo", "Live")}</span>`, "tone-mint-soft"];
}

function pairs(st) {
  const last = st.connections.slice(-3).reverse();
  if (!last.length) return `<p class="muted" style="font-size:14px">${tr("Aún no hay conexiones. La primera enciende la noche.", "No connections yet. The first one lights up the night.")}</p>`;
  return last.map((c) => {
    const a = st.people.get(c.a), b = st.people.get(c.b);
    if (!a || !b) return "";
    return `<div class="pair">${avatar(a, 28)}<span class="names grow ellipsis">${esc(first(a))} ⇄ ${esc(first(b))}${c.topics.length ? ` <span class="muted">· ${esc(c.topics[0])}</span>` : ""}</span><span class="chip">${esc(ago(st, c.t))}</span></div>`;
  }).join("");
}

function liveCard(st, me, v) {
  const [badge, tone] = header(st);
  const c = st.counters;
  let body;
  if (st.phase === "upcoming") {
    body = `<div style="text-align:center;padding:6px 0"><span class="num big">${countdown(st)}</span><p class="muted" style="margin-top:4px">${tr("para abrir puertas · " + clock(st, st.s.eventStartsAtSec), "until doors open · " + clock(st, st.s.eventStartsAtSec))}</p></div>`;
  } else if (!c.checkedIn && !c.connections) {
    body = `<div class="empty" style="padding:14px"><h3 style="color:var(--ink)">${tr("La noche aún no arranca", "The night hasn't started yet")}</h3><p style="margin-top:4px;font-size:14px">${tr("Haz check-in y sé la primera conexión.", "Check in and make the first connection.")}</p></div>`;
  } else {
    const p = pulse(st);
    body = `<div class="stats">
        <div class="stat"><span class="num">${fmt(c.connections)}</span><span class="caps">${tr("conexiones", "connections")}</span></div>
        <div class="stat"><span class="num">${fmt(c.checkedIn)}</span><span class="caps">${tr("en el evento", "checked in")}</span></div>
        <div class="stat"><span class="num">${fmt(c.active)}</span><span class="caps">${tr("activos 10 min", "active 10 min")}</span></div></div>
      <div>${p.html}</div>
      <div><div class="caps" style="margin-bottom:2px">${tr("Últimas parejas", "Latest pairs")}</div>${pairs(st)}</div>`;
  }
  const mine = v && me && me.checkinT !== null;
  const rankChip = mine && v.rank ? `<span class="chip" style="background:var(--sun)">${v.tiedWith ? "=" : ""}#${fmt(v.crank)} ${tr("de", "of")} ${fmt(v.total)}</span>` : "";
  const delta = !mine ? "" : st.phase === "ended"
    ? `<div class="delta"><span>${tr("Tu noche", "Your night")}: <b>${fmt(me.points)} pts</b></span>${rankChip}</div>`
    : `<div class="delta"><span>${me.recent > 0 ? `<b style="color:#0a7a45">+${fmt(me.recent)} pts</b> ${tr("en los últimos 10 min", "in the last 10 min")}` : `<span class="muted">${tr("Sin puntos nuevos en 10 min", "No new points in 10 min")}</span>`}</span>${rankChip}</div>`;
  const cta = st.phase === "ended" ? `<a class="btn sun" href="recap-card.html${location.search}">${tr("Ver el resumen de la noche", "See the night recap")}</a>` : "";
  return `<section class="card ${tone}" style="display:flex;flex-direction:column;gap:12px" aria-label="${tr("Evento en vivo", "Live event")}">
    <div class="row" style="justify-content:space-between"><h2>${st.phase === "ended" ? tr("Así cerró la noche", "How the night closed") : tr("La noche", "The night")}</h2>${badge}</div>
    ${st.phase === "running" && st.s.eventEndsAtSec - st.t <= LAST_CALL ? `<div class="chip" style="align-self:flex-start;background:#fff">${tr(`Quedan ${Math.ceil((st.s.eventEndsAtSec - st.t) / 60)} min: ¡conecta ya!`, `${Math.ceil((st.s.eventEndsAtSec - st.t) / 60)} min left: connect now!`)}</div>` : ""}
    ${body}${delta ? `<div style="border-top:2px solid var(--ink);padding-top:10px">${delta}</div>` : ""}${cta}</section>`;
}

function rankCard(st, me, v) {
  if (!me || me.checkinT === null) return `<section class="card sm row"><span class="grow"><span class="caps">${tr("Tu lugar", "Your spot")}</span><br>${tr("Haz check-in para entrar al ranking", "Check in to join the ranking")}</span></section>`;
  if (!v.rank) return `<section class="card sm row">${avatar(me, 40)}<span class="grow"><span class="caps">${tr("Tu lugar", "Your spot")}</span><br><span style="font-size:14px">${tr("Tu primera conexión te mete al ranking", "Your first connection puts you on the board")}</span></span><span class="num" style="font-size:22px">0</span></section>`;
  const hint = v.rank === 1 ? tr("Vas primero", "You're first") : v.gap > 0 ? tr(`A ${fmt(v.gap)} pts de ${first(v.above)}`, `${fmt(v.gap)} pts behind ${first(v.above)}`) : tr(`Empatado con ${first(v.above)}`, `Tied with ${first(v.above)}`);
  return `<section class="card sm row">${avatar(me, 40)}<span class="grow"><span class="caps">${tr("Tu lugar", "Your spot")}</span><br><span class="num" style="font-size:22px">${v.tiedWith ? "=" : ""}#${fmt(v.crank)}</span> <span class="muted ellipsis" style="font-size:13px">${esc(hint)}</span></span><span style="text-align:right"><span class="num" style="font-size:22px">${fmt(me.points)}</span><br><span class="caps">pts</span></span></section>`;
}

run((st, me, v) => `<div class="row" style="justify-content:space-between"><h1>${tr("Inicio", "Home")}</h1><span class="chip ellipsis" style="max-width:55%">${me ? esc(label(me)) : ""}</span></div>` +
  liveCard(st, me, v) + rankCard(st, me, v) +
  (st.phase === "ended" ? "" : `<a class="btn" href="#">${tr("Conectar ahora", "Connect now")}</a>`));
</script>
</body>
</html>
