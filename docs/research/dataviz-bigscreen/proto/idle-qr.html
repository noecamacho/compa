<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>COMPA idle-qr (attract mode)</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="_shared.css">
<style>
.stale-pill { top: 18px !important; }
.bar { position: absolute; left: 0; top: 0; right: 0; height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: #fff; border-bottom: 6px solid var(--ink); transition: background-color 600ms; z-index: 20; }
.bar.closing { background: var(--coral); }
.brand { display: flex; align-items: center; gap: 22px; font: 700 56px/1 var(--display); }
.brand .pill { font-size: 30px; color: var(--ink); }
.clock { display: flex; align-items: baseline; gap: 16px; font-family: var(--display); font-weight: 700; }
.clock b { font-size: 68px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock span { font-size: 30px; }
.bump { animation: bump 450ms cubic-bezier(.2,.9,.3,1.4); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.pop { animation: pop 420ms cubic-bezier(.2,.9,.3,1.4) both; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.stale .livey { opacity: .45; filter: grayscale(.6); transition: opacity 400ms; }
.modehud { position: fixed; left: 8px; bottom: 22px; font: 700 14px/1 ui-monospace, monospace; color: var(--muted); z-index: 99; }
.idle { position: absolute; left: 0; right: 0; top: 100px; bottom: 0; }
.qrcard { position: absolute; left: 60px; top: 110px; width: 694px; padding: 24px; background: var(--sun); text-align: center; }
.qrbox { background: #fff; border: 5px solid var(--ink); border-radius: 18px; padding: 14px; line-height: 0; }
.qrurl { margin-top: 16px; font: 700 40px/1.1 var(--display); }
.idle-r { position: absolute; left: 800px; right: 60px; top: 40px; bottom: 40px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.h-main { margin: 0; font: 700 104px/1.08 var(--display); }
.h-sub { margin: 0; font: 600 56px/1.1 var(--display); color: var(--muted); }
.joined { display: flex; align-items: center; gap: 28px; padding: 14px 32px; background: var(--mint-soft); }
.joined .jn { font: 700 150px/1 var(--display); font-variant-numeric: tabular-nums; }
.joined .jt { font: 700 44px/1.15 var(--display); min-width: 0; } .joined .jt small { display: block; font: 800 32px/1.2 var(--body); color: var(--muted); }
.stack { display: grid; grid-template-columns: repeat(10, 92px); gap: 12px; align-content: start; min-height: 196px; }
.stack .more { width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: flex; align-items: center; justify-content: center; font: 700 34px var(--display); }
.stack-empty { grid-column: 1 / -1; padding: 28px; border: 4px dashed var(--ink); border-radius: 22px; font: 700 40px/1.2 var(--display); color: var(--muted); }
.tip { padding: 22px 32px; background: var(--sky-soft); font: 800 44px/1.2 var(--body); min-height: 150px; display: flex; align-items: center; gap: 24px; margin-top: auto; }
.tip.quiet { background: var(--coral-soft); font-size: 46px; }
.tip-in { animation: tipin 400ms ease-out; } @keyframes tipin { from { opacity: 0; transform: translateY(14px); } }
.tipdot { flex: none; width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--ink); background: var(--mint); display: flex; align-items: center; justify-content: center; font: 700 34px var(--display); }
</style></head>
<body><div class="stage"></div>
<script src="_shared.js"></script>
<script>
const { opts, COLORS, CATEGORY, POINTS, fmt, clock, avatar, fakeQr, hash } = COMPA;
const es = opts.locale === "es";
const T = (en, sp) => (es ? sp : en);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const stage = document.querySelector(".stage");
document.body.classList.toggle("reduced", opts.reduced);
document.body.classList.toggle("shot", opts.shot);
document.body.classList.toggle("stale", opts.stale > 0);
const bump = (node) => { node.classList.remove("bump"); void node.offsetWidth; node.classList.add("bump"); };

// Keyed DOM sync: reuses nodes (photos do not reload), animates only entries added after the first sync.
function syncKeyed(parent, items, key, make, upd) {
  const map = parent._m || (parent._m = new Map());
  const seen = new Set(), nodes = [];
  items.forEach((it, i) => {
    const k = key(it); seen.add(k);
    let n = map.get(k);
    if (!n) { n = make(it, i); if (parent._init) n.classList.add("pop"); map.set(k, n); }
    if (upd) upd(n, it, i);
    nodes.push(n);
  });
  for (const [k, n] of map) if (!seen.has(k)) { n.remove(); map.delete(k); }
  nodes.forEach((n, i) => { if (parent.children[i] !== n) parent.insertBefore(n, parent.children[i] || null); });
  parent._init = true;
  return nodes;
}

// Top bar: brand + phase pill left, clock right (stale pill sits in the free centre). Coral while closing.
function Bar(root) {
  const bar = el(`<header class="bar"><div class="brand">compa <span class="pill"></span></div><div class="clock"><span class="cl"></span><b class="cv"></b></div></header>`);
  root.appendChild(bar);
  const pill = bar.querySelector(".pill"), cl = bar.querySelector(".cl"), cv = bar.querySelector(".cv");
  let key = "";
  return {
    update(s, scn, closing) {
      bar.classList.toggle("closing", closing);
      const startsIn = scn.eventStartsAtSec - s.now;
      const k = s.phase + closing;
      if (k !== key) {
        key = k;
        const tone = { pre: [COLORS.sun, T("Starting soon", "Empieza pronto")], live: [COLORS.coral, `<span class="live-dot"></span>${T("LIVE", "EN VIVO")}`], closing: [COLORS.white, `<span class="live-dot" style="background:${COLORS.coral}"></span>${T("LAST CALL", "ÚLTIMA LLAMADA")}`], ended: [COLORS.silver, T("Ended", "Terminó")] }[s.phase];
        pill.style.background = tone[0]; pill.innerHTML = tone[1];
      }
      if (s.phase === "ended") { cl.textContent = ""; cv.style.fontSize = "52px"; cv.textContent = T("Event ended", "Evento terminado"); return; }
      cv.style.fontSize = "";
      cl.textContent = s.phase === "pre" ? T("Starts in", "Empieza en") : s.phase === "closing" ? T("Ends in", "Termina en") : T("left", "restante");
      cv.textContent = clock(s.phase === "pre" ? startsIn : s.remaining);
      cl.style.order = s.phase === "live" ? 2 : 0;
    },
  };
}

function Qr(size, label) {
  return `<div class="qrbox" style="width:${size + 38}px">${fakeQr(size, "compa-join")}</div>${label ? `<div class="qrurl">${label}</div>` : ""}`;
}

// Attract layer: giant QR, joined counter with stacking avatars, rotating tip, quiet-minute prompt.
function Idle(root) {
  const node = el(`<section class="idle"><div class="card qrcard">${Qr(600, "compa.app/e/demo")}</div>
    <div class="idle-r"><h1 class="h-main truncate"></h1><h2 class="h-sub truncate"></h2>
    <div class="card joined livey"><span class="jn num">0</span><span class="jt"></span></div>
    <div class="stack livey"></div><div class="card tip"><span class="tipdot">+</span><span class="tt"></span></div></div></section>`);
  root.appendChild(node);
  const q = (c) => node.querySelector(c);
  const [hMain, hSub, jn, jt, stack, tip, tt] = ["h-main", "h-sub", "jn", "jt", "stack", "tip", "tt"].map((c) => q("." + c));
  let lastN = -1, lastTip = "", headKey = "";
  return {
    el: node,
    update(s) {
      const ended = s.phase === "ended";
      const hk = ended + "";
      if (hk !== headKey) { headKey = hk; const a = ended ? T("Thanks for coming", "Gracias por venir") : T("Scan to join", "Escanea para entrar"), b = ended ? T("See you at the next event", "Nos vemos en el próximo evento") : T("Escanea para entrar", "Scan to join"); hMain.textContent = a; hSub.textContent = b; }
      const n = s.counters.checkedIn;
      if (n !== lastN) { jn.textContent = fmt(n); if (lastN >= 0) bump(jn); lastN = n; }
      jt.innerHTML = `${n === 1 ? T("person is in", "persona ya está") : T("people are in", "personas ya están")}${s.registered > n ? `<small>${T("of", "de")} ${fmt(s.registered)} ${T("registered", "registradas")}</small>` : ""}`;
      // newest arrivals first; 19 avatars + overflow chip fit two rows
      const recent = [...s.people].sort((x, y) => y.checkedInAt - x.checkedInAt).slice(0, n > 20 ? 19 : 20);
      stack.querySelector(".stack-empty")?.remove();
      syncKeyed(stack, recent, (p) => p.id, (p) => el(`<span class="avwrap" style="display:inline-flex">${avatar(p, 92)}</span>`));
      stack.querySelector(".more")?.remove();
      if (n > 20) stack.appendChild(el(`<span class="more num">+${fmt(n - 19)}</span>`));
      if (!n) stack.appendChild(el(`<div class="stack-empty">${T("Be the first: scan the QR and say hi", "Sé la primera persona: escanea el QR y saluda")}</div>`));
      const quiet = (s.phase === "live" || s.phase === "closing") && s.idleFor > 180;
      const tips = [T(`Scan someone's QR to connect: +${POINTS.new} each`, `Escanea el QR de alguien para conectar: +${POINTS.new} cada uno`), T(`Met before? Reconnect for +${POINTS.reconnection}`, `¿Ya se conocían? Reencuéntrense: +${POINTS.reconnection}`), T(`Record a voice note after chatting: +${POINTS.summary}`, `Graba una nota de voz tras platicar: +${POINTS.summary}`), T(`Pick what you talked about: +${POINTS.topics}`, `Elige de qué hablaron: +${POINTS.topics}`)];
      const idx = opts.reduced || opts.shot ? 0 : Math.floor(performance.now() / 6000) % tips.length;
      const topic = s.topics[0]?.name;
      const text = quiet ? (topic ? T(`Quiet minute? Find someone who likes <u>${esc(topic)}</u>`, `¿Minuto tranquilo? Busca a alguien a quien le guste <u>${esc(topic)}</u>`) : T("Quiet minute? Say hi to someone new", "¿Minuto tranquilo? Saluda a alguien nuevo")) : ended ? T("Scan to see your profile and connections", "Escanea para ver tu perfil y tus conexiones") : tips[idx];
      if (text !== lastTip) { lastTip = text; tt.innerHTML = text; tip.classList.toggle("quiet", quiet); tt.classList.remove("tip-in"); void tt.offsetWidth; tt.classList.add("tip-in"); tip.querySelector(".tipdot").textContent = quiet ? "?" : "+"; }
    },
  };
}
const bar = Bar(stage), idle = Idle(stage);
COMPA.run((s, scn) => { bar.update(s, scn, s.phase === "closing"); idle.update(s); }, { tickMs: 500 });
</script></body></html>
