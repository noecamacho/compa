<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COMPA live · Connection pulse</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="_shared.css">
<style>
  .head-l { position: absolute; left: 40px; top: 22px; }
  .head-l h1 { margin: 0; font: 700 56px/1 var(--display); }
  .head-r { position: absolute; right: 40px; top: 22px; display: flex; gap: 24px; align-items: center; }
  .pill.live { background: var(--mint); font-size: 30px; } .pill.final { background: var(--sun); font-size: 30px; } .pill.pre { background: var(--sky); font-size: 30px; }
  .clock { font: 700 64px/1 var(--display); font-variant-numeric: tabular-nums; }

  #left { position: absolute; left: 40px; top: 140px; width: 540px; }
  #rate { padding: 14px 28px 18px; height: 340px; position: relative; }
  #rate .lab { font: 700 32px/1.1 var(--display); }
  #rateN { font: 700 230px/1 var(--display); font-variant-numeric: tabular-nums; margin-top: 4px; display: inline-block; }
  #trend { position: absolute; right: 26px; top: 150px; font: 700 64px/1 var(--display); }
  #rateU { position: absolute; left: 28px; bottom: 16px; font: 800 30px/1 var(--body); color: var(--muted); }
  #rate.cold { background: var(--sky-soft); }
  #rate.cold #rateN { color: var(--muted); }
  #tot { margin-top: 28px; padding: 16px 28px; height: 250px; background: var(--mint-soft); }
  #totN { font: 700 112px/1 var(--display); font-variant-numeric: tabular-nums; }
  #totL { font-size: 32px; color: var(--muted); }
  #split { display: flex; gap: 14px; margin-top: 10px; }
  .sp { display: flex; align-items: center; gap: 8px; font: 700 30px/1 var(--display); white-space: nowrap; }
  .sp i { width: 28px; height: 28px; border: 3px solid var(--ink); border-radius: 8px; }
  #qrbox { position: absolute; left: 40px; top: 810px; width: 540px; height: 240px; padding: 15px 20px; display: flex; gap: 24px; align-items: center; background: #fff; }
  #qrbox .t { font: 700 40px/1.1 var(--display); } #qrbox .t small { display: block; font: 800 28px/1.2 var(--body); color: var(--muted); margin-top: 6px; }
  #qrbox svg { flex: none; display: block; border-radius: 10px; }
  #qrbox.big { left: 930px; top: 520px; width: 640px; height: 330px; z-index: 6; }

  #chart { position: absolute; left: 620px; top: 140px; width: 1260px; height: 910px; padding: 0; background: #fff; overflow: hidden; }
  #svg { position: absolute; left: 0; top: 0; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .ms { position: absolute; white-space: nowrap; font: 700 28px/1.1 var(--display); background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 5px 12px; box-shadow: 3px 3px 0 var(--ink); max-width: 640px; overflow: hidden; text-overflow: ellipsis; transform: translateX(-50%); }
  .ms.edge-r { transform: translateX(-100%); } .ms.edge-l { transform: translateX(0); }
  .ms b { font-size: 1.15em; }
  .ytick { position: absolute; left: 14px; font: 700 28px/1 var(--display); color: var(--muted); transform: translateY(-50%); background: #fff; padding: 0 6px; }
  .xtick { position: absolute; bottom: 14px; font: 700 28px/1 var(--display); transform: translateX(-50%); color: var(--muted); }
  .band-l { position: absolute; font: 700 28px/1 var(--display); color: #b23a1e; }
  #nudge { position: absolute; left: 90px; right: 90px; top: 330px; text-align: center; background: var(--sun-soft); border: 4px dashed var(--ink); border-radius: var(--r-card); padding: 24px 30px; z-index: 4; }
  #nudge h2 { margin: 0 0 6px; font: 700 54px/1.1 var(--display); } #nudge p { margin: 0; font-size: 32px; line-height: 1.25; color: #3c3850; }
  #livedot { fill: var(--ink); }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
  @keyframes ring { from { transform: scale(0.6); opacity: .8; } to { transform: scale(2.6); opacity: 0; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="head-l"><h1 id="title"></h1></div>
  <div class="head-r"><span id="phase"></span><span class="clock" id="clock"></span></div>
  <div id="left">
    <div class="card" id="rate"><div class="lab" id="rateL"></div><div id="rateN">0</div><div id="trend"></div><div id="rateU"></div></div>
    <div class="card" id="tot"><div id="totN">0</div><div id="totL"></div><div id="split"></div></div>
  </div>
  <div class="card" id="qrbox"></div>
  <div class="card" id="chart"><svg id="svg" width="1260" height="910" viewBox="0 0 1260 910"></svg><div id="overlay"></div></div>
</div>
<script src="_shared.js"></script>
<script>
(function () {
  const C = COMPA;
  if (C.opts.reduced) document.body.classList.add("reduced");
  const es = C.opts.locale === "es";
  const L = es ? {
    title: "El pulso", live: "EN VIVO", final: "FINAL", pre: "PRONTO", left: "restante", starts: "empieza en",
    rateL: "ahora mismo", rateLF: "récord del evento", unit: "conexiones por minuto", total: "conexiones en total", nw: "nuevas", re: "reencuentros",
    scan: "Escanea para entrar", scanSub: "Sube la marea", last10: "Últimos 10 min", first: "Primera", nth: (n) => `Conexión ${n}`, peak: "Pico", perMin: "/min",
    emptyH: "La marea está baja", emptyP: "Cada conexión la sube. Escanea el QR y saluda a alguien.",
    flatH: "Línea plana", flatP: "Nadie ha conectado en los últimos minutos. Ve y saluda a alguien cerca.", finalCap: "Final",
  } : {
    title: "The pulse", live: "LIVE", final: "FINAL", pre: "SOON", left: "left", starts: "starts in",
    rateL: "right now", rateLF: "event record", unit: "connections per minute", total: "connections in total", nw: "new", re: "reconnections",
    scan: "Scan to join", scanSub: "Raise the tide", last10: "Last 10 min", first: "First", nth: (n) => `Connection ${n}`, peak: "Peak", perMin: "/min",
    emptyH: "The tide is out", emptyP: "Every connection raises it. Scan the QR and say hi to someone.",
    flatH: "Flat line", flatP: "Nobody has connected in the last few minutes. Go say hi to someone nearby.", finalCap: "Final",
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const W = 1260, H = 910, PL = 90, PR = 40, PT = 150, PB = 80; // plot padding
  const BUCKET = 60, IDLE_NUDGE = 180;
  const short = (s) => { const f = s.split(" ")[0]; return f.length > 10 ? f.slice(0, 9) + "…" : f; };

  $("title").textContent = L.title; $("rateU").textContent = L.unit; $("totL").textContent = L.total;
  $("split").innerHTML = `<span class="sp"><i style="background:var(--mint)"></i><span id="nN">0</span> ${L.nw}</span><span class="sp"><i style="background:var(--gum)"></i><span id="nR">0</span> ${L.re}</span>`;
  $("qrbox").innerHTML = C.fakeQr(200, "pulse") + `<div class="t">${L.scan}<small>${L.scanSub}</small></div>`;

  const tween = {};
  function setNum(id, v) {
    const el = $(id), from = Number(el.dataset.v ?? v);
    el.dataset.v = v;
    if (C.opts.reduced || from === v) { el.textContent = C.fmt(v); return; }
    const t0 = performance.now();
    cancelAnimationFrame(tween[id]);
    const f = (n) => { const k = Math.min(1, (n - t0) / 400); el.textContent = C.fmt(Math.round(from + (v - from) * k)); if (k < 1) tween[id] = requestAnimationFrame(f); };
    tween[id] = requestAnimationFrame(f);
  }
  // Catmull-Rom to cubic Bezier through points [[x,y],...]
  function curve(pts) {
    if (pts.length < 2) return "";
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]), cl = (y) => Math.min(hi, Math.max(lo, y)); // no overshoot below the baseline
      d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${cl(p1[1] + (p2[1] - p0[1]) / 6)} ${p2[0] - (p3[0] - p1[0]) / 6},${cl(p2[1] - (p3[1] - p1[1]) / 6)} ${p2[0]},${p2[1]}`;
    }
    return d;
  }
  const niceMax = (v) => { const steps = [4, 6, 8, 10, 12, 16, 20, 25, 30, 40, 50, 60, 80, 100, 150, 200, 300]; return steps.find((s) => s >= v) || Math.ceil(v / 100) * 100; };
  const tlabel = (sec) => { const m = Math.round(sec / 60); return m < 60 ? m + "m" : Math.floor(m / 60) + "h" + (m % 60 ? String(m % 60).padStart(2, "0") : ""); };
  const mmss = (sec) => C.clock(sec);

  function render(state, scn) {
    const start = scn.eventStartsAtSec, end = scn.eventEndsAtSec;
    const pre = state.phase === "pre", ended = state.phase === "ended", closing = state.phase === "closing";
    $("phase").innerHTML = `<span class="pill ${ended ? "final" : pre ? "pre" : "live"}">${ended || pre ? "" : '<i class="live-dot"></i>'}${ended ? L.final : pre ? L.pre : L.live}</span>`;
    $("clock").textContent = ended ? "" : C.clock(pre ? start - state.now : state.remaining) + " " + (pre ? "" : L.left);

    const conns = state.connections.filter((c) => c.t >= start);
    const n = conns.length;
    const cutNow = ended ? end : state.now;
    const live60 = (kind) => conns.filter((c) => c.t > cutNow - 60 && (!kind || c.kind === kind)).length;
    const mk = (kind) => ({ now: state.now, connections: conns.filter((c) => !kind || c.kind === kind) });
    const totalS = C.rateSeries(mk(null), BUCKET, start), newS = C.rateSeries(mk("new"), BUCKET, start), reS = C.rateSeries(mk("reconnection"), BUCKET, start);
    const elapsed = state.elapsed, full = Math.floor(Math.max(0, Math.min(elapsed, end - start)) / BUCKET); // completed minutes
    const peakV = totalS.reduce((m, v) => Math.max(m, v), 0);
    const peakI = totalS.indexOf(peakV);

    // big number: live rate, or the record once ended
    const rateNow = ended ? peakV : live60(null);
    setNum("rateN", rateNow);
    $("rateL").textContent = ended ? L.rateLF : L.rateL;
    $("rate").classList.toggle("cold", rateNow === 0 && !ended);
    const prev = conns.filter((c) => c.t > cutNow - 120 && c.t <= cutNow - 60).length;
    $("trend").textContent = ended ? "" : rateNow > prev ? "▲" : rateNow < prev ? "▼" : "";
    $("trend").style.color = rateNow > prev ? "#1f9d63" : "#b23a1e";
    setNum("totN", n); setNum("nN", state.counters.newCount); setNum("nR", state.counters.reconnections);

    // domain: grows with the event so the tide fills the plot; reaches the end (and the closing band) late in the event
    const len = end - start;
    const domEnd = ended || closing ? len : Math.min(len, Math.max(900, elapsed * 1.12));
    const pw = W - PL - PR, ph = H - PT - PB;
    const X = (sec) => PL + (Math.max(0, sec) / domEnd) * pw;

    // curve points: completed minutes at bucket centers, plus a live point at "now"
    const lastBucket = ended ? Math.ceil(len / BUCKET) : full;
    const pts = [];
    const tot = totalS.slice(0, lastBucket), nw = newS.slice(0, lastBucket), re = reS.slice(0, lastBucket); // raw per-minute values so the curve matches the peak label
    for (let i = 0; i < tot.length; i++) pts.push({ t: (i + 0.5) * BUCKET, nw: nw[i], re: re[i] });
    if (!ended && !pre) pts.push({ t: elapsed, nw: live60("new"), re: live60("reconnection") });
    const peakSm = Math.max(1, ...pts.map((p) => p.nw + p.re), peakV * 0.6);
    const yMax = niceMax(peakSm * 1.25);
    const Y = (v) => PT + ph - (v / yMax) * ph;
    if (pts.length) pts.unshift({ t: 0, nw: 0, re: 0 });

    let svg = "";
    // closing band (last 10 min), only when inside the domain
    const bandStart = len - 600;
    if (bandStart < domEnd) {
      const bx = X(bandStart);
      svg += `<rect x="${bx}" y="${PT - 30}" width="${PL + pw - bx}" height="${ph + 30}" fill="#FFE1D9" opacity="${closing || ended ? 0.95 : 0.55}"/>`;
    }
    // y grid
    const yt = 4;
    let ylabels = "";
    for (let i = 0; i <= yt; i++) {
      const v = (yMax / yt) * i, y = Y(v);
      svg += `<line x1="${PL}" x2="${PL + pw}" y1="${y}" y2="${y}" stroke="#1E1B2E" stroke-opacity="${i === 0 ? 1 : 0.13}" stroke-width="${i === 0 ? 4 : 2}" ${i === 0 ? "" : 'stroke-dasharray="3 9"'}/>`;
      if (i > 0 && i < yt && n > 0) ylabels += `<span class="ytick" style="top:${y}px">${Math.round(v)}</span>`;
    }
    // x ticks
    let xlabels = "";
    const tstep = [300, 600, 900, 1800, 3600].find((s) => (s / domEnd) * pw >= 150) || 3600;
    for (let t = tstep; t < domEnd; t += tstep) xlabels += `<span class="xtick" style="left:${X(t)}px">${tlabel(t)}</span>`;
    if (bandStart < domEnd) xlabels += `<span class="band-l" style="left:${Math.min(X(bandStart) + 10, W - 190)}px;top:${PT - 28}px">${L.last10}</span>`;

    // stacked smooth areas
    const empty = n === 0;
    const base = Y(0);
    if (pts.length > 1) {
      const lower = pts.map((p) => [X(p.t), Y(p.nw)]), upper = pts.map((p) => [X(p.t), Y(p.nw + p.re)]);
      const xl = lower[lower.length - 1][0];
      svg += `<path d="${curve(lower)} L${xl},${base} L${lower[0][0]},${base} Z" fill="#6BE4A3"/>`;
      svg += `<path d="${curve(upper)} L${[...lower].reverse().map((p) => `${p[0]},${p[1]}`).join(" L")} Z" fill="#FF8FAB"/>`;
      svg += `<path d="${curve(upper)}" fill="none" stroke="#1E1B2E" stroke-width="5" stroke-linejoin="round"/>`;
      svg += `<path d="${curve(lower)}" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-opacity=".55"/>`;
    }
    // live dot
    if (!ended && !pre && pts.length) {
      const lp = pts[pts.length - 1], lx = X(lp.t), ly = Y(lp.nw + lp.re);
      svg += `<circle class="ring" cx="${lx}" cy="${ly}" r="14" fill="#FF6B4A"/><circle cx="${lx}" cy="${ly}" r="14" fill="#FF6B4A" stroke="#1E1B2E" stroke-width="4"/>`;
    } else if (!pre && !empty && !ended) { /* nothing */ }
    if (empty) { // dotted flat tide line: a skeleton, not a void
      svg += `<line x1="${PL}" x2="${PL + pw}" y1="${base - 6}" y2="${base - 6}" stroke="#1E1B2E" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round"/>`;
    }
    $("svg").innerHTML = svg;

    // milestones
    const ms = [];
    const atT = (t) => { const p = pts.length ? pts.reduce((b, q) => (Math.abs(q.t - t) < Math.abs(b.t - t) ? q : b), pts[0]) : null; return p ? Y(p.nw + p.re) : base; };
    const pair = (c) => `${short(C.nameOf(state, c.a))} ⇄ ${short(C.nameOf(state, c.b))}`;
    if (n >= 1) ms.push({ t: conns[0].t - start, html: `<b>${L.first}</b> ${esc(pair(conns[0]))} · ${mmss(conns[0].t - start)}`, key: "first" });
    [100, 500, 1000, 2000].forEach((k) => { if (n >= k) ms.push({ t: conns[k - 1].t - start, html: `<b>${L.nth(C.fmt(k))}</b> · ${mmss(conns[k - 1].t - start)}`, key: "n" + k }); });
    if (peakV >= 3 && peakI >= 0) ms.push({ t: (peakI + 0.5) * BUCKET, html: `<b>${L.peak} ${peakV}${L.perMin}</b> · ${mmss(peakI * BUCKET)}`, key: "peak" });
    ms.sort((a, b) => a.t - b.t);
    let mhtml = "", dots = "";
    const lanes = [-999, -999, -999, -999]; // right edge per lane
    ms.forEach((m) => {
      if (m.t > domEnd) return;
      const x = X(m.t), y = atT(m.t);
      const wEst = 40 + m.html.replace(/<[^>]+>/g, "").length * 15;
      const left = Math.max(0, Math.min(W - wEst, x - wEst / 2));
      let lane = lanes.findIndex((r) => left > r + 12);
      if (lane < 0) lane = lanes.indexOf(Math.min(...lanes));
      lanes[lane] = left + wEst;
      const ly = PT - 60 + lane * 56 > y - 70 ? Math.max(PT - 60 + lane * 56, 10) : PT - 60 + lane * 56;
      const labelY = Math.min(ly, y - 60);
      const cls = left <= 0 ? "ms edge-l" : x + wEst / 2 > W ? "ms edge-r" : "ms";
      const lx = cls === "ms edge-l" ? 8 : cls === "ms edge-r" ? W - 8 : x;
      mhtml += `<div class="${cls}" style="left:${lx}px;top:${Math.max(8, labelY)}px">${m.html}</div>`;
      dots += `<line x1="${x}" x2="${x}" y1="${Math.max(8, labelY) + 46}" y2="${y}" stroke="#1E1B2E" stroke-width="3" stroke-dasharray="2 6"/><circle cx="${x}" cy="${y}" r="11" fill="#FFD93D" stroke="#1E1B2E" stroke-width="4"/>`;
    });
    $("svg").insertAdjacentHTML("beforeend", dots);
    $("overlay").innerHTML = ylabels + xlabels + mhtml +
      (empty && !ended ? "" : "") +
      (ended ? `<div class="ms edge-r" style="left:${W - 8}px;top:8px;background:var(--sun)"><b>${L.finalCap}</b> · ${C.fmt(n)} ${L.total}</div>` : "");

    // empty state and idle nudge
    const idle = !ended && !pre && n > 0 && state.idleFor > IDLE_NUDGE && live60(null) === 0;
    const nudge = (empty && !ended) || idle;
    let el = $("nudge");
    if (nudge && !el) { el = document.createElement("div"); el.id = "nudge"; $("chart").appendChild(el); }
    if (!nudge && el) el.remove();
    if (nudge) el.innerHTML = `<h2>${empty ? L.emptyH : L.flatH}</h2><p>${empty ? L.emptyP : L.flatP}</p>`;
    const big = empty && !ended;
    const q = $("qrbox");
    if (q.classList.contains("big") !== big) {
      q.classList.toggle("big", big);
      q.innerHTML = C.fakeQr(big ? 260 : 200, "pulse") + `<div class="t">${L.scan}<small>${L.scanSub}</small></div>`;
    }
    $("nudge") && ($("nudge").style.top = big ? "170px" : "330px");
  }
  C.run(render, { tickMs: 500 });
})();
</script>
</body>
</html>
