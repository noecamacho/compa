<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>COMPA live: treemap</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="_shared.css">
<style>
.top { position: absolute; left: 40px; right: 40px; top: 18px; height: 92px; display: flex; align-items: center; gap: 24px; }
.logo { font: 700 60px/1 var(--display); letter-spacing: 1px; }
#pill { font-size: 32px; padding: 8px 22px; background: var(--mint); white-space: nowrap; }
#pill.closing { background: var(--coral); }
#pill.ended { background: var(--sun); }
#pill.pre { background: var(--sky); }
#clk { margin-left: auto; font: 700 60px/1 var(--display); white-space: nowrap; }
#clk small { font-size: 32px; color: var(--muted); font-weight: 600; margin-left: 8px; }
#main { position: absolute; left: 40px; top: 130px; width: 1200px; height: 910px; }
.side { position: absolute; left: 1280px; top: 130px; width: 600px; height: 910px; }
.cnt { position: absolute; left: 0; width: 600px; height: 128px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; }
.cnt span { font: 700 34px/1.1 var(--display); }
.cnt b { font: 700 84px/1 var(--display); font-variant-numeric: tabular-nums; display: inline-block; transition: transform .25s ease-out; }
.cnt b.bump { transform: scale(1.18); }
.sidecard { position: absolute; left: 0; top: 436px; width: 600px; height: 474px; padding: 24px; }
.qrcard { display: flex; flex-direction: column; align-items: center; gap: 16px; background: #fff; }
.qrcard svg, .invqr svg { border: 4px solid var(--ink); border-radius: 12px; display: block; }
.qrcard b { font: 700 46px/1 var(--display); }
.qrcard i, .invqr i { font: 800 28px/1 var(--body); font-style: normal; color: var(--muted); }
.howto { background: var(--sun-soft); display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.howto h3 { margin: 0; font: 700 44px/1.1 var(--display); }
.howto div { display: flex; align-items: center; gap: 18px; font: 800 34px/1.15 var(--body); }
.howto div em { flex: none; width: 60px; height: 60px; border-radius: 50%; border: 4px solid var(--ink); background: #fff; display: grid; place-items: center; font: 700 36px/1 var(--display); font-style: normal; }
.invite { position: absolute; inset: 0; display: flex; align-items: center; gap: 40px; padding: 40px 48px; background: var(--sun-soft); }
.invite .it { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px; }
.invite h1 { margin: 0; font: 700 84px/1.02 var(--display); }
.invite p { margin: 0; font: 800 38px/1.25 var(--body); color: var(--ink); }
.invqr { flex: none; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.invqr b { font: 700 44px/1 var(--display); }
.here { display: flex; align-items: center; gap: 0; font: 700 38px/1 var(--display); }
.here .av { margin-right: -16px; border-width: 4px; }
.here span { margin-left: 32px; }
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.03); } }
.final { position: absolute; z-index: 20; font: 700 64px/1 var(--display); padding: 10px 28px; background: var(--sun); border: 4px solid var(--ink); border-radius: 18px; box-shadow: var(--hard-6); transform: rotate(4deg); }
#cap { position: absolute; left: 0; top: 0; height: 44px; font: 800 28px/44px var(--body); color: var(--muted); white-space: nowrap; }
#tm { position: absolute; left: 0; top: 56px; width: 1200px; height: 854px; }
.cell { position: absolute; border: 4px solid var(--ink); border-radius: 18px; box-shadow: var(--hard-4); padding: 10px 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; gap: 2px; transition: left .5s cubic-bezier(.3,.9,.3,1), top .5s cubic-bezier(.3,.9,.3,1), width .5s cubic-bezier(.3,.9,.3,1), height .5s cubic-bezier(.3,.9,.3,1), opacity .35s; }
.cell .nm { font: 700 var(--fs, 32px)/1.1 var(--display); }
.cell .sc { font: 700 var(--fn, 64px)/1 var(--display); font-variant-numeric: tabular-nums; margin-top: auto; }
.cell.nonum .sc { display: none; }
.cell.more { background: repeating-linear-gradient(135deg, #fff 0 14px, #f3ecdc 14px 28px) !important; }
.cell.hit::after { content: ""; position: absolute; inset: 0; background: #fff; animation: hit .7s ease-out forwards; }
@keyframes hit { 0% { opacity: .65; } 100% { opacity: 0; } }
</style></head>
<body><div class="stage"></div>
<script src="_shared.js"></script>
<script>
const C = COMPA, K = C.COLORS, O = C.opts, ES = O.locale === "es";
if (O.reduced) document.body.classList.add("reduced");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const TC = ES
  ? { connections: "Conexiones", checkedIn: "Registrados", notes: "Notas", scan: "Escanea para entrar", left: "restante", final: "FINAL", startsIn: "Empieza en", closing: "ÚLTIMOS 10 MIN", howTitle: "Así se juega", steps: ["Escanea el QR", "Saluda a alguien", "Sube en el ranking"], here: "ya están aquí", hereOne: "ya está aquí" }
  : { connections: "Connections", checkedIn: "Checked in", notes: "Notes", scan: "Scan to join", left: "left", final: "FINAL", startsIn: "Starts in", closing: "LAST 10 MIN", howTitle: "How it works", steps: ["Scan the QR", "Say hi to someone", "Climb the board"], here: "here already", hereOne: "is here" };
const QR_URL = "compa.app/e/demo";
document.querySelector(".stage").insertAdjacentHTML("afterbegin", `
<header class="top"><div class="logo">COMPA</div><div id="pill" class="pill"></div><div id="clk"></div></header>
<main id="main"></main>
<aside class="side">
 <div class="cnt card" style="top:0;background:var(--mint-soft)"><span>${TC.connections}</span><b id="c1">0</b></div>
 <div class="cnt card" style="top:140px;background:var(--sky-soft)"><span>${TC.checkedIn}</span><b id="c2">0</b></div>
 <div class="cnt card" style="top:280px;background:var(--gum-soft)"><span>${TC.notes}</span><b id="c3">0</b></div>
 <div id="qrc" class="sidecard card qrcard"></div>
 <div id="how" class="sidecard card howto" style="display:none"></div>
</aside>`);
$("qrc").innerHTML = `${C.fakeQr(280)}<b>${TC.scan}</b><i>${QR_URL}</i>`;
$("how").innerHTML = `<h3>${TC.howTitle}</h3>` + TC.steps.map((s, i) => `<div><em>${i + 1}</em>${s}</div>`).join("");
const prevNum = {};
function setNum(id, v) {
  const el = $(id), txt = C.fmt(v);
  if (el.textContent === txt) return;
  const had = prevNum[id] !== undefined;
  el.textContent = txt; prevNum[id] = v;
  if (!had || O.reduced) return;
  el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 250);
}
// zero=true: side column swaps the QR card for the how-to (the invite in #main carries the big QR).
function chrome(state, scn, zero) {
  const pill = $("pill"), clk = $("clk"), ph = state.phase;
  pill.className = "pill " + ph;
  if (ph === "ended") { pill.textContent = TC.final; clk.innerHTML = ""; }
  else if (ph === "pre") { pill.textContent = `${TC.startsIn} ${C.clock(scn.eventStartsAtSec - state.now)}`; clk.innerHTML = ""; }
  else {
    pill.innerHTML = `<span class="live-dot"></span>${ph === "closing" ? TC.closing : C.copy.live}`;
    clk.innerHTML = `${C.clock(state.remaining)}<small>${TC.left}</small>`;
  }
  setNum("c1", state.counters.connections); setNum("c2", state.counters.checkedIn); setNum("c3", state.counters.summaries);
  $("qrc").style.display = zero ? "none" : ""; $("how").style.display = zero ? "" : "none";
}
let invSig = "";
function invite(el, title, sub, state) {
  const people = state.people.slice(0, 6), n = state.people.length;
  const sig = title + n + people.map((p) => p.id).join();
  if (sig === invSig && el.firstChild) return;
  invSig = sig;
  const here = n ? `<div class="here">${people.map((p) => C.avatar(p, 72)).join("")}<span>${n === 1 ? esc(people[0].display) + " " + TC.hereOne : (n > 6 ? "+" + C.fmt(n - 6) + " · " : "") + C.fmt(n) + " " + TC.here}</span></div>` : "";
  el.innerHTML = `<div class="invite card"><div class="it"><h1>${title}</h1><p>${sub}</p>${here}</div><div class="invqr pulse">${C.fakeQr(420)}<b>${TC.scan}</b><i>${QR_URL}</i></div></div>`;
}
const T = ES
  ? { zeroT: "Los temas aparecen cuando la gente conecta", zeroS: "El área de cada tema crece con las conexiones (+1) y las notas aprobadas (×3).", cap: "Área = puntaje del tema · conexión +1 · nota ×3", more: "más", final: "Clasificación final" }
  : { zeroT: "Topics appear when people connect", zeroS: "Each topic grows with every connection (+1) and approved note (×3).", cap: "Area = topic score · connection +1 · note ×3", more: "more", final: "Final standings" };
const W = 1200, H = 854, GAP = 6, MAXCELLS = 12;
$("main").innerHTML = `<div id="inv"></div><div id="wrap" style="display:none"><div id="cap">${T.cap}</div><div id="tm"></div><div class="final" id="fin" style="right:10px;top:-6px;display:none">${TC.final}</div></div>`;
const tm = $("tm"), cells = new Map(), gone = new Map(), prevScore = new Map();
const PAL = [K.mint, K.sky, K.sun, K.gum, K.coral, K.bronze, "#B9A7FF"];

// Squarified treemap (Bruls et al.). items sorted desc, each {value}; returns rects in the same order.
function squarify(items, x, y, w, h) {
  const total = items.reduce((s, i) => s + i.value, 0), out = [];
  const scale = (w * h) / total, nodes = items.map((i) => ({ ...i, area: i.value * scale }));
  let rest = nodes.slice();
  const worst = (row, side) => { const s = row.reduce((a, n) => a + n.area, 0), mx = Math.max(...row.map((n) => n.area)), mn = Math.min(...row.map((n) => n.area)); return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn)); };
  while (rest.length) {
    const side = Math.min(w, h), row = [rest[0]];
    let i = 1;
    while (i < rest.length && worst([...row, rest[i]], side) <= worst(row, side)) row.push(rest[i++]);
    rest = rest.slice(row.length);
    const s = row.reduce((a, n) => a + n.area, 0);
    if (w >= h) { const rw = s / h; let cy = y; for (const n of row) { const ch = n.area / rw; out.push({ ...n, x, y: cy, w: rw, h: ch }); cy += ch; } x += rw; w -= rw; }
    else { const rh = s / w; let cx = x; for (const n of row) { const cw = n.area / rh; out.push({ ...n, x: cx, y, w: cw, h: rh }); cx += cw; } y += rh; h -= rh; }
  }
  return out;
}
const colorOf = new Map();
// First-seen order, so a topic keeps its color and neighbours rarely match (hash collisions made three yellow cells).
const colorIdx = (k) => { if (!colorOf.has(k)) colorOf.set(k, colorOf.size % PAL.length); return colorOf.get(k); };
function render(state, scn) {
  const zero = state.topics.length === 0;
  chrome(state, scn, zero);
  $("inv").style.display = zero ? "" : "none"; $("wrap").style.display = zero ? "none" : "";
  if (zero) { invite($("inv"), T.zeroT, T.zeroS, state); return; }
  const ended = state.phase === "ended", ts = state.topics;
  const shown = ts.length > MAXCELLS ? ts.slice(0, MAXCELLS - 1) : ts;
  const items = shown.map((t) => ({ key: t.name, name: t.name, value: t.score }));
  const hidden = ts.slice(shown.length);
  if (hidden.length) items.push({ key: "\u0000more", name: `+${C.fmt(hidden.length)} ${T.more}`, value: Math.min(hidden.reduce((s, t) => s + t.score, 0), shown[shown.length - 1].score * 1.6), more: true });
  items.sort((a, b) => b.value - a.value || a.name.localeCompare(b.name));
  const rects = squarify(items, 0, 0, W, H), keys = new Set(rects.map((r) => r.key));
  for (const r of rects) {
    let el = cells.get(r.key);
    if (gone.has(r.key)) { clearTimeout(gone.get(r.key)); gone.delete(r.key); }
    if (!el) {
      el = document.createElement("div"); el.className = "cell" + (r.more ? " more" : ""); el.style.opacity = 0;
      el.style.background = r.more ? "#fff" : PAL[colorIdx(r.key)];
      el.innerHTML = `<div class="nm"></div><div class="sc num"></div>`;
      tm.appendChild(el); cells.set(r.key, el); requestAnimationFrame(() => requestAnimationFrame(() => (el.style.opacity = 1)));
    }
    const w = r.w - GAP, h = r.h - GAP;
    Object.assign(el.style, { left: r.x + GAP / 2 + "px", top: r.y + GAP / 2 + "px", width: w + "px", height: h + "px" });
    // Type scales with the cell; the name never drops below 28 px and hides when it cannot fit.
    const area = w * h, fs = Math.round(Math.min(110, Math.max(28, Math.sqrt(area) / 6.5)));
    const fitFs = Math.max(28, Math.min(fs, Math.floor((w - 36) / (Math.max(6, Math.min(r.name.length, 12)) * 0.56))));
    const fits = w >= 120 && h >= 52;
    el.querySelector(".nm").style.display = fits ? "" : "none";
    el.style.setProperty("--fs", fitFs + "px");
    el.style.setProperty("--fn", Math.round(Math.min(150, Math.max(64, fitFs * 1.5))) + "px");
    el.classList.toggle("nonum", r.more || h < 64 + fitFs * 1.2 + 30 || w < 150);
    el.style.whiteSpace = ""; const nm = el.querySelector(".nm");
    if (nm.textContent !== r.name) nm.textContent = r.name;
    nm.style.cssText = fits ? `display:block;overflow:hidden;text-overflow:ellipsis;${h < fitFs * 2.6 || w < 220 ? "white-space:nowrap" : "display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical"}` : "display:none";
    const sc = el.querySelector(".sc"), v = C.fmt(r.value);
    if (sc.textContent !== v) sc.textContent = v;
    const before = prevScore.get(r.key);
    if (before !== undefined && r.value > before && !ended && !O.reduced) { el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); }
    prevScore.set(r.key, r.value);
  }
  for (const [k, el] of cells) if (!keys.has(k) && !gone.has(k)) {
    el.style.opacity = 0;
    gone.set(k, setTimeout(() => { el.remove(); cells.delete(k); gone.delete(k); prevScore.delete(k); }, 400));
  }
  $("fin").style.display = ended ? "" : "none";
}
COMPA.run(render);
</script></body></html>
