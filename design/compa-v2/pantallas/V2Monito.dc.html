<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compa V2 · Tu monito</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF6E5;color:#1E1B2E;font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1E1B2E;text-decoration:none}a:hover{color:#C2412A}
.d{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700}
.muted{color:#6F6A7E}
.ib{display:flex;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;border-radius:14px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E;color:#1E1B2E;cursor:pointer;padding:0;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 20px;box-sizing:border-box;border-radius:16px;border:2.5px solid #1E1B2E;box-shadow:4px 4px 0 #1E1B2E;font:700 16px/1 Fredoka,Nunito,sans-serif;color:#1E1B2E;background:#FFFFFF;cursor:pointer;white-space:nowrap;width:100%}
.lbl{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#6F6A7E}
.fila{display:flex;align-items:center;gap:10px;min-height:40px}
.fila .lbl{width:62px;flex-shrink:0}
.ops{display:flex;gap:8px;flex:1;align-items:center;flex-wrap:wrap}
.sw{width:32px;height:32px;box-sizing:border-box;border-radius:50%;border:2.5px solid #1E1B2E;cursor:pointer;padding:0;flex-shrink:0}
.chp{height:32px;padding:0 11px;box-sizing:border-box;border-radius:10px;border:2.5px solid #1E1B2E;font:800 12px/1 Nunito,sans-serif;color:#1E1B2E;cursor:pointer;white-space:nowrap;background:#FFFFFF}
.sep{border-top:1.5px dashed rgba(30,27,46,0.3)}
svg{flex-shrink:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;padding:48px 18px 30px;display:flex;flex-direction:column;gap:14px;background-color:#FFF6E5;background-image:radial-gradient(rgba(30,27,46,0.07) 1.2px,transparent 1.3px);background-size:22px 22px">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="V2Perfil.dc.html" aria-label="Regresar" class="ib"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 class="d" style="margin:0;font-size:22px">Tu monito</h1>
    <button aria-label="Al azar" onClick="{{ azar }}" class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg></button>
  </div>

  <!-- Escenario -->
  <div style="display:flex;align-items:center;gap:16px;padding:12px 16px;box-sizing:border-box;border-radius:22px;background:#FFF3BF;border:2.5px solid #1E1B2E;box-shadow:4px 4px 0 #1E1B2E">
    <span style="display:flex;align-items:flex-end;justify-content:center;width:124px;height:150px;box-sizing:border-box;border-radius:18px;background:#FFFFFF;border:2.5px solid #1E1B2E;padding-bottom:6px;flex-shrink:0"><dc-import name="Monito" look="{{ look }}" px="7" label="Tu monito" hint-size="112px,140px"></dc-import></span>
    <span style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0">
      <span class="d" style="font-size:22px;line-height:1.1">Diego Ramírez</span>
      <span class="muted" style="font-size:13px;font-weight:700;line-height:1.35">Así te van a ver en el evento. Pocas opciones a propósito: lo demás lo ganas conectando.</span>
    </span>
  </div>

  <!-- Opciones -->
  <div style="display:flex;flex-direction:column;gap:8px;padding:10px 12px;box-sizing:border-box;border-radius:16px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E">
    <div class="fila">
      <span class="lbl">Piel</span>
      <div class="ops" role="radiogroup" aria-label="Tono de piel">
        <sc-for list="{{ pieles }}" as="o" hint-placeholder-count="5"><button class="sw" role="radio" aria-checked="{{ o.checked }}" aria-label="{{ o.nombre }}" onClick="{{ o.pick }}" style="{{ o.style }}"></button></sc-for>
      </div>
    </div>
    <div class="fila sep" style="padding-top:8px">
      <span class="lbl">Pelo</span>
      <div class="ops" role="radiogroup" aria-label="Pelo">
        <sc-for list="{{ pelos }}" as="o" hint-placeholder-count="4"><button class="chp" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.nombre }}</button></sc-for>
      </div>
    </div>
    <div class="fila sep" style="padding-top:8px">
      <span class="lbl">Color</span>
      <div class="ops" role="radiogroup" aria-label="Color de pelo">
        <sc-for list="{{ peloColores }}" as="o" hint-placeholder-count="4"><button class="sw" role="radio" aria-checked="{{ o.checked }}" aria-label="{{ o.nombre }}" onClick="{{ o.pick }}" style="{{ o.style }}"></button></sc-for>
      </div>
    </div>
    <div class="fila sep" style="padding-top:8px">
      <span class="lbl">Camisa</span>
      <div class="ops" role="radiogroup" aria-label="Color de camisa">
        <sc-for list="{{ camisas }}" as="o" hint-placeholder-count="6"><button class="sw" role="radio" aria-checked="{{ o.checked }}" aria-label="{{ o.nombre }}" onClick="{{ o.pick }}" style="{{ o.style }}"></button></sc-for>
      </div>
    </div>
    <div class="fila sep" style="padding-top:8px">
      <span class="lbl">Extras</span>
      <div class="ops" role="group" aria-label="Accesorios">
        <sc-for list="{{ extras }}" as="o" hint-placeholder-count="3"><button class="chp" aria-pressed="{{ o.pressed }}" onClick="{{ o.toggle }}" style="{{ o.style }}">{{ o.nombre }}</button></sc-for>
      </div>
    </div>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <a href="V2Inicio.dc.html" class="btn" style="background:#6BE4A3">Listo, entrar</a>
    <span class="muted" style="align-self:center;font-size:12px;font-weight:800">Paso 2 de 2 · lo puedes cambiar desde tu perfil</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { piel: '#F5C9A3', pelo: 'corto', peloColor: '#5A3825', camisa: '#6BE4A3', ex: { gorra: false, lentes: false, barba: false } };
  }
  renderVals() {
    const st = this.state;
    const sel = (hex, on) => 'background:' + hex + (on ? ';box-shadow:0 0 0 3px #FFFFFF, 0 0 0 5px #1E1B2E' : '');
    const PIEL = [{ n: 'Muy clara', h: '#FFE0C7' }, { n: 'Clara', h: '#F5C9A3' }, { n: 'Media', h: '#E0A97F' }, { n: 'Morena', h: '#94603F' }, { n: 'Oscura', h: '#5C3A21' }];
    const PELO = [{ n: 'Corto', k: 'corto' }, { n: 'Largo', k: 'largo' }, { n: 'Chongo', k: 'chongo' }, { n: 'Rizado', k: 'rizado' }];
    const PCOL = [{ n: 'Negro', h: '#2A2438' }, { n: 'Café', h: '#5A3825' }, { n: 'Pelirrojo', h: '#D9664F' }, { n: 'Rubio', h: '#E8C170' }];
    const CAM = [{ n: 'Menta', h: '#6BE4A3' }, { n: 'Cielo', h: '#6CC4FF' }, { n: 'Chicle', h: '#FF8FAB' }, { n: 'Sol', h: '#FFD93D' }, { n: 'Coral', h: '#FF6B4A' }, { n: 'Tinta', h: '#1E1B2E' }];
    const EX = [{ n: 'Gorra', k: 'gorra' }, { n: 'Lentes', k: 'lentes' }, { n: 'Barba', k: 'barba' }];
    const pieles = PIEL.map((o) => ({ nombre: o.n, checked: st.piel === o.h ? 'true' : 'false', style: sel(o.h, st.piel === o.h), pick: () => this.setState({ piel: o.h }) }));
    const pelos = PELO.map((o) => ({ nombre: o.n, checked: st.pelo === o.k ? 'true' : 'false', style: st.pelo === o.k ? 'background:#1E1B2E;color:#FFF6E5' : '', pick: () => this.setState({ pelo: o.k }) }));
    const peloColores = PCOL.map((o) => ({ nombre: o.n, checked: st.peloColor === o.h ? 'true' : 'false', style: sel(o.h, st.peloColor === o.h), pick: () => this.setState({ peloColor: o.h }) }));
    const camisas = CAM.map((o) => ({ nombre: o.n, checked: st.camisa === o.h ? 'true' : 'false', style: sel(o.h, st.camisa === o.h), pick: () => this.setState({ camisa: o.h }) }));
    const extras = EX.map((o) => ({ nombre: o.n, pressed: st.ex[o.k] ? 'true' : 'false', style: st.ex[o.k] ? 'background:#1E1B2E;color:#FFF6E5' : '', toggle: () => this.setState({ ex: Object.assign({}, st.ex, { [o.k]: !st.ex[o.k] }) }) }));
    const look = {
      piel: st.piel, pelo: st.pelo, peloColor: st.peloColor, ropa: 'lisa', camisa: st.camisa, pantalon: '#4A6FA5', tenis: '#FFFFFF',
      gorra: st.ex.gorra ? 'gorra' : 'ninguna', gorraColor: '#FF6B4A', gorraAcento: '#FFFFFF',
      cara: st.ex.lentes ? 'lentes' : 'nada', barba: st.ex.barba, extra: 'nada'
    };
    const r = (a) => a[Math.floor(Math.random() * a.length)];
    return {
      look, pieles, pelos, peloColores, camisas, extras,
      azar: () => this.setState({ piel: r(PIEL).h, pelo: r(PELO).k, peloColor: r(PCOL).h, camisa: r(CAM).h, ex: { gorra: Math.random() < 0.3, lentes: Math.random() < 0.3, barba: Math.random() < 0.2 } })
    };
  }
}
</script>
</body>
</html>
