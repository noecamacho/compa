<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compa V2 · Bienvenida</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF6E5;color:#1E1B2E;font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1E1B2E;text-decoration:none}a:hover{color:#C2412A}
.d{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700}
.muted{color:#6F6A7E}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 20px;box-sizing:border-box;border-radius:16px;border:2.5px solid #1E1B2E;box-shadow:4px 4px 0 #1E1B2E;font:700 17px/1 Fredoka,Nunito,sans-serif;color:#1E1B2E;background:#FFFFFF;cursor:pointer;white-space:nowrap}
.step{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;line-height:1.3}
.seg{height:40px;border:0;border-radius:11px;font:700 15px/1 Fredoka,Nunito,sans-serif;cursor:pointer}
.num{flex-shrink:0;width:28px;height:28px;box-sizing:border-box;border-radius:50%;background:#FFFFFF;border:2.5px solid #1E1B2E;display:flex;align-items:center;justify-content:center;font:700 13px/1 Fredoka,sans-serif}
svg{flex-shrink:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;padding:56px 24px 34px;display:flex;flex-direction:column;background-color:#FFF6E5;background-image:radial-gradient(rgba(30,27,46,0.07) 1.2px,transparent 1.3px);background-size:22px 22px">

  <div style="display:flex;align-items:center;gap:12px">
    <span aria-hidden="true" style="position:relative;width:46px;height:40px;box-sizing:border-box;border-radius:17px;background:#FFD93D;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E;display:flex;align-items:center;justify-content:center;gap:8px;transform:rotate(-6deg)">
      <span style="width:7px;height:10px;border-radius:4px;background:#1E1B2E"></span><span style="width:7px;height:10px;border-radius:4px;background:#1E1B2E"></span>
      <span style="position:absolute;left:10px;bottom:-10px;width:12px;height:12px;background:#FFD93D;border-left:2.5px solid #1E1B2E;border-bottom:2.5px solid #1E1B2E;transform:skewX(20deg)"></span>
    </span>
    <span class="d" style="font-size:30px;line-height:1;letter-spacing:-0.5px">compa</span>
  </div>

  <div aria-hidden="true" style="position:relative;height:250px;margin-top:22px">
    <span style="position:absolute;left:46px;right:46px;top:108px;border-top:3px dashed #1E1B2E"></span>
    <span style="position:absolute;left:16px;top:36px;width:96px;height:120px;transform:rotate(-5deg)"><dc-import name="Avatar" who="DR" px="6" hint-size="96px,120px"></dc-import></span>
    <span style="position:absolute;right:16px;top:36px;width:96px;height:120px;transform:rotate(5deg) scaleX(-1)"><dc-import name="Avatar" who="VO" px="6" hint-size="96px,120px"></dc-import></span>
    <span style="position:absolute;left:50%;top:22px;display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px;box-sizing:border-box;border-radius:12px;background:#FFD93D;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E;font:700 20px/1 Fredoka,sans-serif;transform:translateX(-50%) rotate(6deg);white-space:nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="#1E1B2E"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>+50</span>
    <span style="position:absolute;left:50%;top:184px;display:inline-flex;align-items:center;height:34px;padding:0 12px;box-sizing:border-box;border-radius:12px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:2px 2px 0 #1E1B2E;font:800 13px/1 Nunito,sans-serif;transform:translateX(-50%) rotate(-3deg);white-space:nowrap">Levantar capital</span>
  </div>

  <h1 class="d" style="margin:10px 0 0;font-size:34px;line-height:1.05;letter-spacing:-0.5px">Conecta en el evento.<br>Recuérdalo después.</h1>

  <ol style="list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:12px">
    <li class="step"><span class="num">1</span>Conecta con quien conozcas escaneando su QR</li>
    <li class="step"><span class="num">2</span>Te quedas con sus redes y de qué hablaron</li>
    <li class="step"><span class="num">3</span>Gana puntos y ropa para tu monito por cada conexión</li>
  </ol>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
    <div role="group" aria-label="¿Cuenta nueva o ya tienes?" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:4px;padding:4px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E;border-radius:16px">
      <button class="seg" aria-pressed="{{ nuevaPressed }}" onClick="{{ toNueva }}" style="{{ nuevaStyle }}">Crear cuenta</button>
      <button class="seg" aria-pressed="{{ entrarPressed }}" onClick="{{ toEntrar }}" style="{{ entrarStyle }}">Ya tengo cuenta</button>
    </div>
    <a href="{{ destino }}" class="btn" style="background:#0A66C2;color:#FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"/></svg>{{ cta }}</a>
    <span class="muted" style="align-self:center;font-size:12px;font-weight:800;text-align:center;line-height:1.4">{{ nota }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { modo: 'nueva' };
  }
  renderVals() {
    const nueva = this.state.modo === 'nueva';
    const on = 'background:#1E1B2E;color:#FFF6E5';
    const off = 'background:transparent;color:#1E1B2E';
    return {
      nuevaPressed: nueva ? 'true' : 'false', entrarPressed: nueva ? 'false' : 'true',
      nuevaStyle: nueva ? on : off, entrarStyle: nueva ? off : on,
      toNueva: () => this.setState({ modo: 'nueva' }),
      toEntrar: () => this.setState({ modo: 'entrar' }),
      destino: nueva ? 'V2Perfil.dc.html' : 'V2Inicio.dc.html',
      cta: nueva ? 'Crear cuenta con LinkedIn' : 'Entrar con LinkedIn',
      nota: nueva ? 'Tomamos tu nombre, puesto, empresa y ciudad. Nunca publicamos nada por ti.' : 'Entras directo a tu perfil y tus conexiones.'
    };
  }
}
</script>
</body>
</html>
