<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compa V2 · Registrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF6E5;color:#1E1B2E;font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1E1B2E;text-decoration:none}a:hover{color:#C2412A}
.d{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700}
.muted{color:#6F6A7E}
.card{background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:4px 4px 0 #1E1B2E;border-radius:22px;box-sizing:border-box}
.ib{display:flex;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;border-radius:14px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E;color:#1E1B2E;cursor:pointer;padding:0;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 20px;box-sizing:border-box;border-radius:16px;border:2.5px solid #1E1B2E;box-shadow:4px 4px 0 #1E1B2E;font:700 16px/1 Fredoka,Nunito,sans-serif;color:#1E1B2E;background:#FFFFFF;cursor:pointer;white-space:nowrap;width:100%}
.lbl{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#6F6A7E}
.tipo{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;height:86px;padding:10px;box-sizing:border-box;border-radius:16px;border:2.5px solid #1E1B2E;color:#1E1B2E;cursor:pointer;text-align:left;font-family:Nunito,sans-serif}
.tic{width:28px;height:28px;box-sizing:border-box;border-radius:50%;border:2px solid #1E1B2E;background:#FFFFFF;display:flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 12px;box-sizing:border-box;border-radius:12px;border:2.5px solid #1E1B2E;box-shadow:2px 2px 0 #1E1B2E;font:800 13px/1 Nunito,sans-serif;white-space:nowrap;cursor:pointer;flex-shrink:0}
.wave{display:flex;align-items:center;gap:4px;height:36px}
.wave>span{display:block;width:5px;border-radius:3px;background:#1E1B2E;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:scaleY(0.35)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){.wave>span{animation:none}}
svg{flex-shrink:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;padding:48px 18px 30px;display:flex;flex-direction:column;gap:16px;background-color:#FFF6E5;background-image:radial-gradient(rgba(30,27,46,0.07) 1.2px,transparent 1.3px);background-size:22px 22px">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="V2Conectar.dc.html" aria-label="Regresar" class="ib"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 class="d" style="margin:0;font-size:20px">Registrar</h1>
    <span style="width:44px"></span>
  </div>

  <!-- Persona -->
  <div class="card" style="display:flex;align-items:center;gap:14px;padding:12px 14px">
    <dc-import name="Avatar" who="VO" size="56" hint-size="56px,56px"></dc-import>
    <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
      <span class="d" style="font-size:19px;line-height:1.15">Valeria Ochoa</span>
      <span class="muted" style="font-size:13px;font-weight:700">CTO · Tlali · Monterrey</span>
    </span>
    <span style="display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;box-sizing:border-box;border-radius:9px;background:#DDF1FF;border:2px solid #1E1B2E;font:800 11px/1 Nunito,sans-serif;white-space:nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1E1B2E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a8 8 0 0 1 13.7-5.3L20 8M20 4v4h-4M20 13a8 8 0 0 1-13.7 5.3L4 16M4 20v-4h4"/></svg>Ya se conocían</span>
  </div>

  <!-- Tipo -->
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="lbl">Tipo de conexión</span>
    <div role="group" aria-label="Tipo de conexión" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
      <button class="tipo" aria-pressed="{{ nPressed }}" onClick="{{ pickNueva }}" style="{{ nStyle }}">
        <span class="tic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E1B2E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.6 3-6.5 7-6.5 1.4 0 2.6.3 3.7.9M18 14v6M15 17h6"/></svg></span>
        <span style="display:flex;flex-direction:column"><span style="font-size:13px;font-weight:800">Nueva</span><span style="font-size:12px;font-weight:700">+50 pts</span></span>
      </button>
      <button class="tipo" aria-pressed="{{ rPressed }}" onClick="{{ pickReencuentro }}" style="{{ rStyle }}">
        <span class="tic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E1B2E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a8 8 0 0 1 13.7-5.3L20 8M20 4v4h-4M20 13a8 8 0 0 1-13.7 5.3L4 16M4 20v-4h4"/></svg></span>
        <span style="display:flex;flex-direction:column"><span style="font-size:13px;font-weight:800">Reencuentro</span><span style="font-size:12px;font-weight:700">+20 pts</span></span>
      </button>
    </div>
  </div>

  <!-- De qué hablaron -->
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="lbl">¿De qué hablaron?</span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ temas }}" as="t" hint-placeholder-count="6">
        <button class="chip" aria-pressed="{{ t.pressed }}" onClick="{{ t.toggle }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
  </div>

  <!-- O cuéntaselo a Compa -->
  <sc-if value="{{ sinNota }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ grabar }}" style="display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;box-sizing:border-box;border-radius:18px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E;cursor:pointer;text-align:left;font-family:Nunito,sans-serif;color:#1E1B2E">
      <span aria-hidden="true" style="width:40px;height:40px;box-sizing:border-box;border-radius:50%;background:#FF6B4A;border:2.5px solid #1E1B2E;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1B2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 0 1 4 4v5a4 4 0 0 1-8 0V7a4 4 0 0 1 4-4z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
      <span style="display:flex;flex-direction:column;gap:1px;flex:1;min-width:0"><span style="font-size:14px;font-weight:800">O cuéntaselo a Compa</span><span class="muted" style="font-size:12px;font-weight:700">Nota de voz, opcional · +15 pts</span></span>
    </button>
  </sc-if>
  <sc-if value="{{ grabando }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ terminar }}" style="display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;box-sizing:border-box;border-radius:18px;background:#FFE1D9;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E;cursor:pointer;text-align:left;font-family:Nunito,sans-serif;color:#1E1B2E">
      <span aria-hidden="true" style="width:40px;height:40px;box-sizing:border-box;border-radius:50%;background:#FF6B4A;border:2.5px solid #1E1B2E;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="width:16px;height:16px;border-radius:4px;background:#1E1B2E;display:block"></span></span>
      <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><span style="font-size:14px;font-weight:800">Grabando · 0:14</span><span class="wave" aria-hidden="true" style="height:22px"><span style="height:10px;animation-delay:0s"></span><span style="height:18px;animation-delay:.12s"></span><span style="height:22px;animation-delay:.24s"></span><span style="height:14px;animation-delay:.36s"></span><span style="height:20px;animation-delay:.48s"></span><span style="height:12px;animation-delay:.6s"></span><span style="height:18px;animation-delay:.72s"></span><span style="height:22px;animation-delay:.84s"></span></span></span>
      <span class="muted" style="font-size:12px;font-weight:800">Toca para terminar</span>
    </button>
  </sc-if>
  <sc-if value="{{ listo }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;box-sizing:border-box;border-radius:18px;background:#DDF8EA;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E">
      <span aria-hidden="true" style="width:40px;height:40px;box-sizing:border-box;border-radius:50%;background:#6BE4A3;border:2.5px solid #1E1B2E;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span>
      <span style="display:flex;flex-direction:column;gap:1px;flex:1;min-width:0"><span style="font-size:14px;font-weight:800">Nota guardada · 0:38</span><span class="muted" style="font-size:12px;font-weight:700">Compa agrega los temas que falten</span></span>
      <button onClick="{{ grabar }}" style="height:30px;padding:0 10px;box-sizing:border-box;border-radius:10px;background:#FFFFFF;border:2.5px solid #1E1B2E;font:700 12px/1 Fredoka,sans-serif;color:#1E1B2E;cursor:pointer">Regrabar</button>
    </div>
  </sc-if>

  <a href="V2Confirmacion.dc.html" class="btn" style="margin-top:auto;background:#6BE4A3">Confirmar · +{{ puntos }} pts</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tipo: 'reencuentro', nota: 'sin', temas: ['Levantar capital', 'Proptech'] };
  }
  renderVals() {
    const tipo = this.state.tipo, nota = this.state.nota;
    const lista = ['Levantar capital', 'IA', 'Proptech', 'Contratar', 'Ventas B2B', 'Fintech'];
    const elegidos = this.state.temas;
    const temas = lista.map((label) => {
      const on = elegidos.indexOf(label) !== -1;
      return {
        label,
        pressed: on ? 'true' : 'false',
        style: on ? 'background:#1E1B2E;color:#FFF6E5' : 'background:#FFFFFF;color:#1E1B2E',
        toggle: () => this.setState({ temas: on ? elegidos.filter((x) => x !== label) : elegidos.concat(label) })
      };
    });
    const color = { nueva: '#6BE4A3', reencuentro: '#6CC4FF' };
    const base = { nueva: 50, reencuentro: 20 };
    const sty = (k) => tipo === k ? 'background:' + color[k] + ';box-shadow:3px 3px 0 #1E1B2E' : 'background:#FFFFFF;box-shadow:2px 2px 0 #1E1B2E';
    return {
      nStyle: sty('nueva'), rStyle: sty('reencuentro'),
      nPressed: tipo === 'nueva' ? 'true' : 'false', rPressed: tipo === 'reencuentro' ? 'true' : 'false',
      pickNueva: () => this.setState({ tipo: 'nueva' }),
      pickReencuentro: () => this.setState({ tipo: 'reencuentro' }),
      sinNota: nota === 'sin', grabando: nota === 'grabando', listo: nota === 'listo',
      grabar: () => this.setState({ nota: 'grabando' }),
      terminar: () => this.setState({ nota: 'listo' }),
      temas,
      puntos: base[tipo] + (elegidos.length > 0 ? 5 : 0) + (nota === 'listo' ? 15 : 0)
    };
  }
}
</script>
</body>
</html>
