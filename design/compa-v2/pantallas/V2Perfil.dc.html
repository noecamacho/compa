<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compa V2 · Tu perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF6E5;color:#1E1B2E;font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1E1B2E;text-decoration:none}a:hover{color:#C2412A}
.d{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700}
.muted{color:#6F6A7E}
.ib{display:flex;align-items:center;justify-content:center;width:44px;height:44px;box-sizing:border-box;border-radius:14px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E;color:#1E1B2E;cursor:pointer;padding:0;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 20px;box-sizing:border-box;border-radius:16px;border:2.5px solid #1E1B2E;box-shadow:4px 4px 0 #1E1B2E;font:700 16px/1 Fredoka,Nunito,sans-serif;color:#1E1B2E;background:#FFFFFF;cursor:pointer;white-space:nowrap;width:100%}
.lbl{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#6F6A7E}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:800}
.inp{display:block;width:100%;height:44px;box-sizing:border-box;border-radius:12px;border:2.5px solid #1E1B2E;background:#FFFFFF;padding:0 12px;font:700 14px Nunito,sans-serif;color:#1E1B2E;outline:none}
.inp:focus{box-shadow:0 0 0 4px #6BE4A3}
.rd{display:flex;align-items:center;justify-content:center;height:44px;padding:0;box-sizing:border-box;border-radius:12px;border:2.5px solid #1E1B2E;cursor:pointer;min-width:0}
svg{flex-shrink:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;padding:48px 18px 30px;display:flex;flex-direction:column;gap:14px;background-color:#FFF6E5;background-image:radial-gradient(rgba(30,27,46,0.07) 1.2px,transparent 1.3px);background-size:22px 22px">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="V2Bienvenida.dc.html" aria-label="Regresar" class="ib"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;box-sizing:border-box;border-radius:10px;background:#DDF1FF;border:2px solid #1E1B2E;font:800 12px/1 Nunito,sans-serif;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5l4 4L18 8"/></svg>Datos de LinkedIn</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:2px">
    <h1 class="d" style="margin:0;font-size:28px;line-height:1.1">Tu perfil</h1>
    <p class="muted" style="margin:0;font-size:14px;font-weight:700">Lo jalamos de LinkedIn. Corrige lo que quieras.</p>
  </div>

  <!-- Datos (prellenados) -->
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="fld"><label for="vNombre">Nombre</label><input id="vNombre" class="inp" type="text" value="Diego Ramírez"></div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
      <div class="fld"><label for="vRol">Puesto</label><input id="vRol" class="inp" type="text" value="Cofounder"></div>
      <div class="fld"><label for="vEmpresa">Empresa</label><input id="vEmpresa" class="inp" type="text" value="Kuali"></div>
    </div>
    <div class="fld"><label for="vCiudad">Ciudad</label><input id="vCiudad" class="inp" type="text" value="Guadalajara, Jalisco"></div>
  </div>

  <!-- Redes que compartes -->
  <div style="display:flex;flex-direction:column;gap:8px;padding:12px 14px;box-sizing:border-box;border-radius:16px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:3px 3px 0 #1E1B2E">
    <span style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span class="lbl">Redes que compartes</span><span class="muted" style="font-size:11px;font-weight:800;white-space:nowrap">Solo las ven tus conexiones</span></span>
    <div role="group" aria-label="Redes que compartes con tus conexiones" style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px">
      <sc-for list="{{ redes }}" as="r" hint-placeholder-count="4">
        <button class="rd" aria-pressed="{{ r.pressed }}" aria-label="{{ r.nombre }}" onClick="{{ r.toggle }}" style="{{ r.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1B2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.path }}"/></svg></button>
      </sc-for>
    </div>
    <span class="muted" style="font-size:12px;font-weight:700">Las apagadas no se muestran a nadie. Lo cambias cuando quieras desde tu perfil.</span>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <a href="V2Monito.dc.html" class="btn" style="background:#6BE4A3">Siguiente: tu monito<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <span class="muted" style="align-self:center;font-size:12px;font-weight:800">Paso 1 de 2</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { linkedin: true, instagram: true, whatsapp: false, x: false } };
  }
  renderVals() {
    const on = this.state.on;
    const defs = [
      { key: 'linkedin', nombre: 'LinkedIn', color: '#DDF1FF', path: 'M3 9h4v12H3zM5 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM11 21v-7a3 3 0 0 1 6 0v7M11 9v12' },
      { key: 'instagram', nombre: 'Instagram', color: '#FFE3EA', path: 'M8 3h8a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM17.5 6.5h.01' },
      { key: 'whatsapp', nombre: 'WhatsApp', color: '#DDF8EA', path: 'M21 12a9 9 0 0 1-13.3 7.9L3 21l1.1-4.7A9 9 0 1 1 21 12z' },
      { key: 'x', nombre: 'X', color: '#FFF3BF', path: 'M4 4l16 16M20 4L4 20' }
    ];
    const redes = defs.map((d) => {
      const a = !!on[d.key];
      return {
        nombre: d.nombre, path: d.path,
        pressed: a ? 'true' : 'false',
        style: a ? 'background:' + d.color + ';box-shadow:2px 2px 0 #1E1B2E' : 'background:#FFFFFF;opacity:.55;box-shadow:none',
        toggle: () => this.setState({ on: Object.assign({}, on, { [d.key]: !a }) })
      };
    });
    return { redes };
  }
}
</script>
</body>
</html>
