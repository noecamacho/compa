<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Monito</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="display:block;width:{{ w }}px;height:{{ h }}px;font-family:Nunito,system-ui,sans-serif;color:#1E1B2E">
  <svg viewBox="0 0 16 20" width="{{ w }}" height="{{ h }}" shape-rendering="crispEdges" role="img" aria-label="{{ label }}" style="display:block">
    <path d="{{ d.s }}" fill="{{ f.s }}"/>
    <path d="{{ d.h }}" fill="{{ f.h }}"/>
    <path d="{{ d.H }}" fill="{{ f.H }}"/>
    <path d="{{ d.t }}" fill="{{ f.t }}"/>
    <path d="{{ d.T }}" fill="{{ f.T }}"/>
    <path d="{{ d.p }}" fill="{{ f.p }}"/>
    <path d="{{ d.b }}" fill="{{ f.b }}"/>
    <path d="{{ d.a }}" fill="{{ f.a }}"/>
    <path d="{{ d.A }}" fill="{{ f.A }}"/>
    <path d="{{ d.l }}" fill="{{ f.l }}"/>
    <path d="{{ d.C }}" fill="{{ f.C }}"/>
    <path d="{{ d.n }}" fill="{{ f.n }}"/>
    <path d="{{ d.k }}" fill="#FF9DB4"/>
    <path d="{{ d.m }}" fill="#8A2E45"/>
    <path d="{{ d.g }}" fill="#FFD93D"/>
    <path d="{{ d.G }}" fill="#FF6B4A"/>
    <path d="{{ d.W }}" fill="#FFFFFF"/>
    <path d="{{ d.R }}" fill="#FF6B4A"/>
    <path d="{{ d.L }}" fill="#FFFFFF"/>
    <path d="{{ d.e }}" fill="#1E1B2E"/>
    <path d="{{ d.o }}" fill="#1E1B2E"/>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":null,"default":null},"px":{"editor":"int","default":10,"min":2,"max":24},"label":{"editor":null,"default":"Monito"},"$preview":{"width":160,"height":200}}'>
class Component extends DCLogic {
  shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const c = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
    const r = c((n >> 16) & 255), g = c((n >> 8) & 255), b = c(n & 255);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
  }
  grid(o) {
    const W = 16, H = 20;
    const g = [];
    for (let r = 0; r < H; r++) g.push(new Array(W).fill('.'));
    const set = (r, c, ch) => { if (r >= 0 && r < H && c >= 0 && c < W) g[r][c] = ch; };
    const row = (r, c1, c2, ch) => { for (let c = c1; c <= c2; c++) set(r, c, ch); };
    const back = (r, c, ch) => { if (r >= 0 && r < H && c >= 0 && c < W && g[r][c] === '.') g[r][c] = ch; };
    const clear = (r1, r2) => { for (let r = r1; r <= r2; r++) row(r, 0, 15, '.'); };
    const recolor = (r, ch) => { for (let c = 0; c < W; c++) if (g[r][c] === 't') g[r][c] = ch; };

    // Cabeza y cara
    row(2, 4, 11, 'o');
    set(3, 3, 'o'); row(3, 4, 11, 's'); set(3, 12, 'o');
    for (let r = 4; r <= 8; r++) { set(r, 2, 'o'); row(r, 3, 12, 's'); set(r, 13, 'o'); }
    set(9, 3, 'o'); row(9, 4, 11, 's'); set(9, 12, 'o');
    row(10, 4, 11, 'o');
    set(6, 5, 'e'); set(7, 5, 'e'); set(6, 10, 'e'); set(7, 10, 'e');
    set(8, 4, 'k'); set(8, 11, 'k'); set(8, 7, 'm'); set(8, 8, 'm');
    // Cuerpo
    set(11, 3, 'o'); row(11, 4, 11, 't'); set(11, 12, 'o');
    set(12, 2, 'o'); row(12, 3, 12, 't'); set(12, 13, 'o');
    set(13, 2, 'o'); set(13, 3, 't'); set(13, 4, 'o'); row(13, 5, 10, 't'); set(13, 11, 'o'); set(13, 12, 't'); set(13, 13, 'o');
    set(14, 2, 'o'); set(14, 3, 's'); set(14, 4, 'o'); row(14, 5, 10, 't'); set(14, 11, 'o'); set(14, 12, 's'); set(14, 13, 'o');
    set(15, 3, 'o'); set(15, 4, 'o'); row(15, 5, 10, 'p'); set(15, 11, 'o'); set(15, 12, 'o');
    set(16, 4, 'o'); row(16, 5, 10, 'p'); set(16, 11, 'o');
    set(17, 4, 'o'); row(17, 5, 6, 'p'); row(17, 7, 8, 'o'); row(17, 9, 10, 'p'); set(17, 11, 'o');
    set(18, 3, 'o'); row(18, 4, 6, 'b'); row(18, 7, 8, 'o'); row(18, 9, 11, 'b'); set(18, 12, 'o');
    row(19, 3, 12, 'o');

    // Ropa
    const ropa = o.ropa || 'lisa';
    if (ropa === 'rayas') { recolor(12, 'T'); recolor(14, 'T'); }
    if (ropa === 'compa') { set(12, 7, 'T'); set(12, 8, 'T'); set(13, 7, 'T'); set(13, 8, 'T'); }
    if (ropa === 'sudadera') { set(12, 6, 'W'); set(13, 6, 'W'); set(12, 9, 'W'); set(13, 9, 'W'); row(14, 6, 9, 'T'); }
    if (ropa === 'evento') { recolor(12, 'T'); set(13, 7, 'W'); set(13, 8, 'W'); }
    if (ropa === 'traje') {
      for (let r = 11; r <= 13; r++) { set(r, 6, 'W'); set(r, 7, 'R'); set(r, 8, 'R'); set(r, 9, 'W'); }
      set(14, 7, 'R'); set(14, 8, 'R');
    }

    // Pelo
    const pelo = o.pelo || 'corto';
    const tapa = () => {
      row(1, 4, 11, 'o');
      set(2, 3, 'o'); row(2, 4, 11, 'h'); set(2, 12, 'o');
      set(3, 2, 'o'); row(3, 3, 12, 'h'); set(3, 13, 'o');
      row(4, 3, 12, 'h');
      set(5, 3, 'h'); set(5, 12, 'h');
    };
    if (pelo === 'corto') tapa();
    if (pelo === 'fleco') { tapa(); set(5, 4, 'h'); set(5, 6, 'h'); set(5, 7, 'h'); set(5, 9, 'h'); set(5, 10, 'h'); set(5, 11, 'h'); }
    if (pelo === 'puntas') {
      set(0, 5, 'o'); set(0, 8, 'o'); set(0, 11, 'o');
      set(1, 4, 'o'); set(1, 5, 'h'); set(1, 6, 'o'); set(1, 7, 'o'); set(1, 8, 'h'); set(1, 9, 'o'); set(1, 10, 'o'); set(1, 11, 'h'); set(1, 12, 'o');
      set(2, 3, 'o'); row(2, 4, 12, 'h'); set(2, 13, 'o');
      set(3, 2, 'o'); row(3, 3, 12, 'h'); set(3, 13, 'o');
      row(4, 3, 12, 'h');
      set(5, 3, 'h'); set(5, 12, 'h');
      set(2, 6, 'H'); set(3, 9, 'H');
    }
    if (pelo === 'largo') {
      tapa();
      set(4, 1, 'o'); row(4, 2, 13, 'h'); set(4, 14, 'o');
      set(5, 1, 'o'); row(5, 2, 3, 'h'); row(5, 12, 13, 'h'); set(5, 14, 'o');
      for (let r = 6; r <= 8; r++) { set(r, 1, 'o'); set(r, 2, 'h'); set(r, 13, 'h'); set(r, 14, 'o'); }
      for (let r = 9; r <= 10; r++) { set(r, 1, 'o'); row(r, 2, 3, 'h'); row(r, 12, 13, 'h'); set(r, 14, 'o'); }
      row(11, 1, 3, 'o'); row(11, 12, 14, 'o');
      set(3, 7, 'H'); set(3, 8, 'H');
    }
    if (pelo === 'chongo') {
      tapa();
      row(0, 6, 9, 'o');
      set(1, 5, 'o'); row(1, 6, 9, 'h'); set(1, 10, 'o');
      set(1, 7, 'H');
    }
    if (pelo === 'rizado') {
      row(0, 4, 11, 'o');
      row(1, 2, 3, 'o'); row(1, 4, 11, 'h'); row(1, 12, 13, 'o');
      for (let r = 2; r <= 4; r++) { set(r, 1, 'o'); row(r, 2, 13, 'h'); set(r, 14, 'o'); }
      set(5, 1, 'o'); row(5, 2, 4, 'h'); row(5, 11, 13, 'h'); set(5, 14, 'o');
      set(6, 1, 'o'); row(6, 2, 3, 'h'); row(6, 12, 13, 'h'); set(6, 14, 'o');
      row(7, 1, 2, 'o'); row(7, 13, 14, 'o');
      [[1, 6], [1, 10], [2, 3], [2, 8], [2, 12], [3, 5], [3, 10], [4, 2], [4, 7], [4, 13]].forEach((q) => set(q[0], q[1], 'H'));
    }
    if (pelo === 'rapado') { row(3, 4, 11, 'h'); set(4, 3, 'h'); set(4, 12, 'h'); }

    // Gorra
    const gorra = o.gorra || 'ninguna';
    if (gorra === 'gorra') {
      clear(0, 1);
      row(1, 4, 11, 'o');
      set(2, 3, 'o'); row(2, 4, 11, 'a'); set(2, 12, 'o');
      set(3, 2, 'o'); row(3, 3, 12, 'a'); set(3, 13, 'o'); set(3, 6, 'A'); set(3, 7, 'A');
      set(4, 2, 'o'); row(4, 3, 14, 'a'); set(4, 15, 'o');
      row(5, 14, 15, 'o');
      if (g[4][1] === 'h') set(4, 1, 'o');
    }
    if (gorra === 'gorro') {
      clear(0, 1);
      row(0, 7, 8, 'o');
      row(1, 4, 6, 'o'); row(1, 7, 8, 'A'); row(1, 9, 11, 'o');
      set(2, 3, 'o'); row(2, 4, 11, 'a'); set(2, 12, 'o');
      set(3, 2, 'o'); row(3, 3, 12, 'a'); set(3, 13, 'o');
      set(4, 2, 'o'); row(4, 3, 12, 'A'); set(4, 13, 'o');
    }
    if (gorra === 'corona') {
      clear(0, 1);
      set(0, 3, 'o'); row(0, 7, 8, 'o'); set(0, 12, 'o');
      set(1, 2, 'o'); set(1, 3, 'g'); set(1, 4, 'o'); set(1, 6, 'o'); row(1, 7, 8, 'g'); set(1, 9, 'o'); set(1, 11, 'o'); set(1, 12, 'g'); set(1, 13, 'o');
      set(2, 2, 'o'); row(2, 3, 12, 'g'); set(2, 13, 'o'); set(2, 7, 'G'); set(2, 8, 'G');
      row(3, 2, 13, 'o');
    }

    // Cara
    const cara = o.cara || 'nada';
    if (cara === 'lentes' || cara === 'lentesSol') {
      set(6, 3, 'o'); row(6, 4, 6, 'l'); row(6, 7, 8, 'o'); row(6, 9, 11, 'l'); set(6, 12, 'o');
      row(7, 4, 6, 'l'); row(7, 9, 11, 'l');
      if (cara === 'lentes') { set(6, 5, 'e'); set(7, 5, 'e'); set(6, 10, 'e'); set(7, 10, 'e'); }
      else { set(6, 4, 'L'); set(6, 9, 'L'); }
    }
    if (cara === 'bigote') { row(8, 6, 9, 'h'); set(9, 6, 'h'); set(9, 9, 'h'); }
    // Barba (se combina con lentes)
    if (o.barba) { row(8, 5, 6, 'h'); row(8, 9, 10, 'h'); row(9, 4, 11, 'h'); set(9, 7, 's'); set(9, 8, 's'); }

    // Extra
    const extra = o.extra || 'nada';
    if (extra === 'gafete') { set(11, 5, 'n'); set(11, 10, 'n'); set(12, 6, 'n'); set(12, 9, 'n'); row(13, 6, 9, 'W'); row(14, 6, 9, 'W'); row(14, 7, 8, 'e'); }
    if (extra === 'medalla') { set(11, 9, 'R'); set(12, 9, 'g'); set(12, 10, 'g'); set(13, 9, 'g'); set(13, 10, 'g'); }
    if (extra === 'capa') {
      back(11, 1, 'o'); back(11, 2, 'C'); back(11, 13, 'C'); back(11, 14, 'o');
      for (let r = 12; r <= 17; r++) { back(r, 0, 'o'); back(r, 1, 'C'); back(r, 14, 'C'); back(r, 15, 'o'); }
      for (let r = 13; r <= 17; r++) { back(r, 2, 'C'); back(r, 13, 'C'); }
      back(18, 0, 'o'); back(18, 1, 'o'); back(18, 2, 'o'); back(18, 13, 'o'); back(18, 14, 'o'); back(18, 15, 'o');
    }
    return g;
  }
  paths(g) {
    const d = {};
    'oemkshHtTpbaAgGlLWRCn'.split('').forEach((ch) => { d[ch] = ''; });
    for (let r = 0; r < g.length; r++) {
      let c = 0;
      while (c < 16) {
        const ch = g[r][c];
        if (ch === '.') { c++; continue; }
        let e = c;
        while (e + 1 < 16 && g[r][e + 1] === ch) e++;
        const w = e - c + 1;
        d[ch] += 'M' + c + ' ' + r + 'h' + w + 'v1h-' + w + 'z';
        c = e + 1;
      }
    }
    return d;
  }
  renderVals() {
    const base = {
      piel: '#F5C9A3', pelo: 'corto', peloColor: '#5A3825', ropa: 'lisa', camisa: '#6BE4A3',
      pantalon: '#4A6FA5', tenis: '#FFFFFF', gorra: 'ninguna', gorraColor: '#FF6B4A', gorraAcento: '#FFFFFF',
      cara: 'nada', extra: 'nada'
    };
    const o = Object.assign({}, base, this.props.look || {});
    const px = this.props.px ?? 10;
    const camisa = o.camisa;
    const acc = {
      rayas: camisa === '#FFFFFF' ? '#1E1B2E' : '#FFFFFF',
      compa: camisa === '#FFD93D' ? '#FF6B4A' : '#FFD93D',
      sudadera: this.shade(camisa, 0.82),
      evento: o.acento || '#FFD93D',
      lisa: '#FFFFFF',
      traje: '#FFFFFF'
    };
    const f = {
      s: o.piel,
      h: o.peloColor,
      H: o.peloColor === '#2A2438' ? '#4A4360' : this.shade(o.peloColor, 0.78),
      t: camisa,
      T: acc[o.ropa] || '#FFFFFF',
      p: o.pantalon,
      b: o.tenis,
      a: o.gorraColor,
      A: o.gorraAcento,
      l: o.cara === 'lentesSol' ? '#2E2B40' : '#DDF1FF',
      C: o.capaColor || '#FF6B4A',
      n: o.cordon || '#6CC4FF'
    };
    return {
      d: this.paths(this.grid(o)),
      f,
      w: 16 * px,
      h: 20 * px,
      label: this.props.label ?? 'Monito'
    };
  }
}
</script>
</body>
</html>
