<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra V2 · píldora que viaja (con QR)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.it{position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;width:50px;box-sizing:border-box;border-radius:25px;border:0;color:#6F6A7E;text-decoration:none;font:700 15px/1 Fredoka,Nunito,sans-serif;white-space:nowrap;cursor:pointer;padding:0;background:transparent;transition:transform .8s cubic-bezier(.34,1.3,.5,1), width .8s cubic-bezier(.34,1.3,.5,1), color .4s}
.it:hover{color:#1E1B2E}
.it.on{color:#1E1B2E;width:150px}
.it .tx{opacity:0;max-width:0;overflow:hidden;transition:opacity .4s, max-width .8s cubic-bezier(.34,1.3,.5,1)}
.it.on .tx{opacity:1;max-width:110px;transition:opacity .4s .35s, max-width .8s cubic-bezier(.34,1.3,.5,1)}
.gota{position:absolute;top:0;left:0;width:150px;height:50px;box-sizing:border-box;border-radius:25px;border:2.5px solid #1E1B2E;box-shadow:inset 0 -4px 0 rgba(30,27,46,0.16), inset 0 3px 0 rgba(255,255,255,0.65);transition:transform .8s cubic-bezier(.34,1.3,.5,1), background-color .8s, opacity .3s}
@media (prefers-reduced-motion: reduce){.it,.it .tx,.gota{transition:none}}
svg{flex-shrink:0}
</style>
</helmet>
<nav aria-label="Navegación principal" style="display:block;width:327px;height:66px;box-sizing:border-box;border-radius:33px;background:#FFFFFF;border:2.5px solid #1E1B2E;box-shadow:4px 4px 0 #1E1B2E;padding:5px;font-family:Nunito,system-ui,sans-serif">
  <div style="position:relative;width:312px;height:50px">
    <span aria-hidden="true" class="gota" style="{{ gota }}"></span>
    <sc-if value="{{ demo }}" hint-placeholder-val="{{ false }}">
      <button class="it {{ i.cls }}" aria-pressed="{{ i.pr }}" onClick="{{ i.go }}" style="{{ i.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="tx">Inicio</span></button>
      <button class="it {{ r.cls }}" aria-pressed="{{ r.pr }}" onClick="{{ r.go }}" style="{{ r.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3"/></svg><span class="tx">Conectar</span></button>
      <button class="it {{ c.cls }}" aria-pressed="{{ c.pr }}" onClick="{{ c.go }}" style="{{ c.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="3"/><path d="M21 20c0-2.5-1.7-4.6-4-5.4"/></svg><span class="tx">Conexiones</span></button>
      <button class="it {{ p.cls }}" aria-pressed="{{ p.pr }}" onClick="{{ p.go }}" style="{{ p.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="tx">Perfil</span></button>
    </sc-if>
    <sc-if value="{{ nav }}" hint-placeholder-val="{{ true }}">
      <a href="V2Inicio.dc.html" class="it {{ i.cls }}" aria-current="{{ i.cur }}" style="{{ i.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="tx">Inicio</span></a>
      <a href="V2Conectar.dc.html" class="it {{ r.cls }}" aria-current="{{ r.cur }}" style="{{ r.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3"/></svg><span class="tx">Conectar</span></a>
      <a href="V2Conexiones.dc.html" class="it {{ c.cls }}" aria-current="{{ c.cur }}" style="{{ c.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="3"/><path d="M21 20c0-2.5-1.7-4.6-4-5.4"/></svg><span class="tx">Conexiones</span></a>
      <a href="V2MiPerfil.dc.html" class="it {{ p.cls }}" aria-current="{{ p.cur }}" style="{{ p.style }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="tx">Perfil</span></a>
    </sc-if>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activa":{"editor":"select","default":"inicio","options":["inicio","conexiones","perfil","conectar"]},"demo":{"editor":"bool","default":false},"$preview":{"width":327,"height":66}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { activa: null };
  }
  renderVals() {
    const demo = !!this.props.demo;
    const keys = ['inicio', 'conectar', 'conexiones', 'perfil'];
    const a0 = (demo && this.state.activa) || this.props.activa || 'inicio';
    const a = keys.indexOf(a0) === -1 ? 'inicio' : a0;
    const k = keys.indexOf(a);
    const col = { inicio: '#DDF1FF', conectar: '#DDF8EA', conexiones: '#FFE3EA', perfil: '#FFF3BF' };
    // Posiciones: cerrado 50, abierto 150, 4 de espacio. Los íconos se recorren para hacerle lugar a la píldora.
    const x = (i) => (i < k ? i * 54 : i === k ? k * 54 : k * 54 + 154 + (i - k - 1) * 54);
    const mk = (key, i) => {
      const on = i === k;
      return {
        cls: on ? 'on' : '',
        cur: on ? 'page' : 'false',
        pr: on ? 'true' : 'false',
        style: 'transform:translateX(' + x(i) + 'px)',
        go: () => this.setState({ activa: key })
      };
    };
    return {
      demo, nav: !demo,
      gota: 'transform:translateX(' + x(k) + 'px);background:' + col[a],
      i: mk('inicio', 0), r: mk('conectar', 1), c: mk('conexiones', 2), p: mk('perfil', 3)
    };
  }
}
</script>
</body>
</html>
