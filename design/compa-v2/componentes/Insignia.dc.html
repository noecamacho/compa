<html lang="es">
<head>
<meta charset="utf-8">
<title>Insignia</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="display:block;width:{{ w }}px;height:{{ h }}px;font-family:Fredoka,Nunito,system-ui,sans-serif;color:#1E1B2E">
  <svg viewBox="0 0 120 {{ vh }}" width="{{ w }}" height="{{ h }}" role="img" aria-label="{{ aria }}" style="display:block;overflow:visible">
    <g transform="{{ tilt }}">
      <path d="{{ forma }}" transform="translate(4,4)" fill="{{ sombra }}"/>
      <path d="{{ forma }}" fill="{{ relleno }}" stroke="{{ borde }}" stroke-width="4" stroke-dasharray="{{ dash }}" stroke-linejoin="round"/>
      <path d="{{ forma }}" transform="translate(60,62) scale(0.84) translate(-60,-62)" fill="none" stroke="{{ borde }}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" opacity="0.7"/>
      <g transform="translate(32,34)" fill="none" stroke="{{ tinta }}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="{{ opIcono }}">
        <path d="{{ ic.a }}" fill="{{ ic.fa }}"/>
        <path d="{{ ic.b }}" fill="{{ ic.fb }}"/>
        <path d="{{ ic.c }}" fill="{{ ic.fc }}"/>
        <path d="{{ ic.d }}" fill="{{ ic.fd }}" stroke="none"/>
        <text x="{{ ic.tx }}" y="{{ ic.ty }}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="{{ ic.ts }}" fill="{{ ic.tf }}" stroke="none">{{ ic.t }}</text>
      </g>
      <sc-if value="{{ bloqueada }}" hint-placeholder-val="{{ false }}">
        <g transform="translate(82,84)"><rect x="-13" y="-2" width="26" height="22" rx="6" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3"/><path d="M-7 -2 V-8 a7 7 0 0 1 14 0 V-2" fill="none" stroke="#1E1B2E" stroke-width="3"/></g>
      </sc-if>

        <path d="M94 18 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="2" stroke-linejoin="round"/>
      </sc-if>
      <sc-if value="{{ conNombre }}" hint-placeholder-val="{{ false }}">
        <g transform="translate(0,116)">
          <path d="M14 8 l-9 16 13 -1 5 12 11 -19z" fill="#FF6B4A" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round"/>
          <path d="M106 8 l9 16 -13 -1 -5 12 -11 -19z" fill="#FF6B4A" stroke="#1E1B2E" stroke-width="3" stroke-linejoin="round"/>
          <rect x="16" y="0" width="88" height="26" rx="7" fill="{{ liston }}" stroke="#1E1B2E" stroke-width="3"/>
          <text x="60" y="18" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="{{ fs }}" fill="#1E1B2E" letter-spacing="0.5">{{ nombreCorto }}</text>
        </g>
      </sc-if>
    </g>
  </svg>
</div>
</x-dc>
