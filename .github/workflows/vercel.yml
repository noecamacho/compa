# Deploys production through the Vercel CLI with the team owner's token, because Vercel Pro
# blocks native git deploys whose commit author is not a member of the Vercel team.
# No preview deployments: the captain decided only production exists (2026-10-29).
# Database migrations run automatically on every deploy (vercel.json buildCommand).
name: Vercel

on:
  push:
    branches: [main]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # A broken commit must never reach Vercel: the same gates as the PR checks run first.
      - name: Lint, typecheck and test
        run: bun run lint && bun run typecheck && bun test
      - name: Install Vercel CLI
        run: bun add --global vercel@60.1.3
      # Vercel builds remotely so the build can read sensitive env values (never downloadable);
      # the build command applies pending migrations first, and a failed migration fails the deploy.
      - name: Deploy (migrate, then build on Vercel)
        id: deploy
        run: echo "url=$(vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")" >> "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          echo "Deployed (production): ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep only the new deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          api="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          new=$(curl -sf "$api/v13/deployments/${NEW_URL#https://}?teamId=$VERCEL_ORG_ID" -H "$auth")
          keep=$(echo "$new" | jq -r '.id // empty')
          state=$(echo "$new" | jq -r '.readyState // empty')
          [ -n "$keep" ] || { echo "Could not resolve the new deployment; skipping cleanup"; exit 0; }
          # Never delete the live deployment unless the new one is serving: a failed build would take the site down.
          [ "$state" = "READY" ] || { echo "New deployment is $state, not READY; keeping older deployments"; exit 1; }
          curl -sf "$api/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=100" -H "$auth" \
            | jq -r --arg keep "$keep" '.deployments[].uid | select(. != $keep)' \
            | xargs -r -I{} curl -sf -X DELETE "$api/v13/deployments/{}?teamId=$VERCEL_ORG_ID" -H "$auth" -o /dev/null
          echo "Kept only $keep" >> "$GITHUB_STEP_SUMMARY"
