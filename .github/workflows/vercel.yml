# Deploys through the Vercel CLI with the team owner's token, because Vercel Pro blocks
# native git deploys whose commit author is not a member of the Vercel team.
name: Vercel

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install Vercel CLI
        run: bun add --global vercel@60.1.3
      - name: Pull project settings and env
        run: vercel pull --yes --environment="$TARGET" --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: vercel build $PROD_FLAG --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt $PROD_FLAG --token="${{ secrets.VERCEL_TOKEN }}")" >> "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          echo "Deployed ($TARGET): ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview URL
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body "Preview: ${{ steps.deploy.outputs.url }} (docs at /api/docs)"
