# Playwright e2e on every pull request (docs/flows/README.md "E2E tests", backlog T-000). Mock-mode specs run against a
# local server with API_MODE=mock. Real-mode specs run only when the captain has configured a SEPARATE test Supabase
# project (never production): the E2E_TEST_BASE_URL variable plus the E2E_TEST_AUTOMATION_SECRET secret.
name: E2E

on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    env:
      API_MODE: mock
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browsers
        run: bun run e2e:install
      - name: Run mock-mode specs
        run: bun run e2e --shard=${{ matrix.shard }}/4
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  real:
    if: ${{ vars.E2E_TEST_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "1"
      E2E_BASE_URL: ${{ vars.E2E_TEST_BASE_URL }}
      TEST_AUTOMATION_SECRET: ${{ secrets.E2E_TEST_AUTOMATION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browsers
        run: bun run e2e:install
      - name: Run real-mode specs
        run: bun run e2e --grep @real
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-real
          path: |
            playwright-report/
            test-results/
          retention-days: 7
